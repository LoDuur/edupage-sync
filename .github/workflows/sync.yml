name: Sync EduPage timetable

on:
  schedule:
    - cron: "*/10 * * * *"
    - cron: "5 18 * * 0-4"
    - cron: "5 19 * * 0-4"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Ensure DejaVu fonts
        run: fc-list | grep -qi dejavu || sudo apt-get install -y -qq fonts-dejavu-core >/dev/null
      - run: python sync.py
        env:
          CLASS_NAME: "2.k. 28.grupa"
          GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          EDUPAGE_PROXY_URL: ${{ vars.EDUPAGE_PROXY_URL }}
          EDUPAGE_PROXY_KEY: ${{ secrets.EDUPAGE_PROXY_KEY }}
          GREEN_API_URL: ${{ vars.GREEN_API_URL }}
          GREEN_API_ID_INSTANCE: ${{ secrets.GREEN_API_ID_INSTANCE }}
          GREEN_API_TOKEN: ${{ secrets.GREEN_API_TOKEN }}
          WHATSAPP_CHAT_ID: ${{ secrets.WHATSAPP_CHAT_ID }}
      - name: Commit state
        id: commit
        run: |
          git config user.name "edupage-sync bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json docs
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "sync $(date -u +'%Y-%m-%d %H:%M UTC')"
          for attempt in 1 2 3; do
            if git push; then
              echo "pushed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "push failed (attempt $attempt), rebasing on origin/${GITHUB_REF_NAME}"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || exit 1
            sleep $((attempt * 3))
          done
          echo "::error::could not push sync commit after 3 attempts; state.json may be re-sent next run"
          exit 1
      - name: Deploy site to Cloudflare
        if: steps.commit.outputs.pushed == 'true' && env.HAS_CLOUDFLARE == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
      - name: Report failure
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          [ -z "$DISCORD_WEBHOOK_URL" ] || curl -s -H 'Content-Type: application/json' \
            -d "{\"content\":\"⚠️ EduPage sync failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "$DISCORD_WEBHOOK_URL"
