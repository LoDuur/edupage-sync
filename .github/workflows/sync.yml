name: Sync EduPage timetable

on:
  schedule:
    - cron: "0 * * * *"
    - cron: "5 4 * * 1-5"
    - cron: "5 5 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python sync.py
        env:
          CLASS_NAME: "2.k. 28.grupa"
          GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          EDUPAGE_PROXY_URL: ${{ vars.EDUPAGE_PROXY_URL }}
          EDUPAGE_PROXY_KEY: ${{ secrets.EDUPAGE_PROXY_KEY }}
          GREEN_API_ID_INSTANCE: ${{ secrets.GREEN_API_ID_INSTANCE }}
          GREEN_API_TOKEN: ${{ secrets.GREEN_API_TOKEN }}
          WHATSAPP_CHAT_ID: ${{ secrets.WHATSAPP_CHAT_ID }}
      - name: Commit state
        run: |
          git config user.name "edupage-sync bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json docs
          git diff --cached --quiet || (git commit -m "sync $(date -u +'%Y-%m-%d %H:%M UTC')" && git push)
      - name: Report failure
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          [ -z "$DISCORD_WEBHOOK_URL" ] || curl -s -H 'Content-Type: application/json' \
            -d "{\"content\":\"⚠️ EduPage sync failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "$DISCORD_WEBHOOK_URL"
