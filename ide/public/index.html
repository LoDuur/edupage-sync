<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<meta name="color-scheme" content="dark">
<title>28teh</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%23050505' stroke='%23333'/><text x='16' y='21' font-family='monospace' font-size='12' fill='%23fff' text-anchor='middle'>28</text></svg>">
<link rel="stylesheet" href="/styles.css">
<link rel="stylesheet" href="/vendor/xterm.css">
</head>
<body>

<div id="gate" class="gate" hidden>
  <form id="gate-form" autocomplete="off">
    <h1>28teh</h1>
    <p>Enter the class access code.</p>
    <input id="gate-input" aria-label="Access code" placeholder="ACCESS CODE" autofocus spellcheck="false">
    <div id="gate-err" class="err" aria-live="polite"></div>
    <button class="cmd" type="submit">Continue</button>
  </form>
</div>

<div id="app" class="app" hidden style="--w-side:220px;--w-ai:380px;--h-term:260px">
  <header class="bar">
    <button class="ibtn" id="tg-side" aria-label="Toggle files" title="Files (⌘B)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="0"/><path d="M9 3v18"/></svg></button>
    <div class="crumb"><span>28teh</span><span class="sep">›</span><b id="crumb-file">main.py</b><span id="saved" class="text-t3 text-2xs pl-2" aria-live="polite"></span></div>
    <span class="grow"></span>
    <button class="cmd" id="run" title="Run active file in the sandbox (⌘↵)"><svg id="run-ico" width="14" height="14" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><polygon points="6 3 20 12 6 21 6 3"/></svg><span id="run-lbl">Run</span></button>
    <button class="ibtn" id="tg-term" aria-label="Toggle terminal" title="Terminal (⌘J)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 17 10 11 4 5"/><line x1="12" x2="20" y1="19" y2="19"/></svg></button>
    <button class="ibtn" id="tg-ai" aria-label="Toggle assistant" title="Assistant (⌘I)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3"/><path d="M15 3v18"/></svg></button>
    <button class="ibtn" id="more" aria-label="More actions" aria-haspopup="menu"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg></button>
  </header>

  <div class="work">
    <aside class="panel sidebar" aria-label="Files">
      <div class="panel-h"><span>Files</span><span class="grow"></span><button class="ibtn new" id="new-file" aria-label="New file" title="New file"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg></button></div>
      <div id="files" class="py-1 overflow-y-auto" role="listbox" aria-label="Workspace files"></div>
    </aside>
    <div class="split-x split-side" id="split-side" role="separator" aria-orientation="vertical" aria-label="Resize files panel" tabindex="0"></div>

    <main class="main">
      <section class="editor-host panel" aria-label="Editor"><div id="editor"></div></section>
      <div class="split-y" id="split-term" role="separator" aria-orientation="horizontal" aria-label="Resize terminal" tabindex="0"></div>
      <section class="panel" aria-label="Terminal">
        <div class="panel-h"><span>Terminal</span><span class="grow"></span><span id="term-hint" class="normal-case tracking-normal"></span><button class="ibtn" id="term-clear" aria-label="Clear terminal" title="Clear (Ctrl+L)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"/><path d="M22 21H7"/><path d="m5 11 9 9"/></svg></button><button class="ibtn" id="term-restart" aria-label="Restart sandbox" title="Restart sandbox"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg></button></div>
        <div class="term-host"><div id="terminal"></div><div id="term-empty" class="term-empty" hidden></div></div>
      </section>
    </main>

    <div class="split-x split-ai" id="split-ai" role="separator" aria-orientation="vertical" aria-label="Resize assistant panel" tabindex="0"></div>
    <aside class="panel assistant" aria-label="Assistant">
      <div class="panel-h"><span>Assistant</span><span class="grow"></span><button class="cmd normal-case tracking-normal" id="model-btn" aria-haspopup="menu" title="Model"><img id="model-ico" width="16" height="16" alt="" hidden><span id="model-lbl">Model</span><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></button></div>
      <div class="chat" id="chat" aria-live="polite">
        <div class="empty" id="chat-empty">Ask about the open file, the terminal output, or the last error — or pick an action below.</div>
      </div>
      <div class="composer">
        <div class="actions" id="actions">
          <button class="cmd" data-act="explain">Explain</button>
          <button class="cmd" data-act="review">Review</button>
          <button class="cmd" data-act="understand">Understand</button>
          <button class="cmd" data-act="practice">Practice</button>
          <button class="cmd" data-act="fix">Fix</button>
          <button class="cmd" id="apply-last" disabled title="Apply the last code block to the editor">Apply</button>
        </div>
        <textarea id="prompt" rows="2" placeholder="Ask about your code…" aria-label="Message the assistant"></textarea>
        <div class="row"><span>Enter to send · Shift+Enter newline</span><span class="grow"></span><button class="cmd" id="send">Send</button></div>
      </div>
    </aside>
  </div>

  <footer class="bar statusbar">
    <span class="si" id="st-container"><span class="dot" id="st-dot"></span><span id="st-container-text">sandbox</span></span>
    <span class="sep"></span>
    <span class="si" id="st-idle" hidden></span>
    <span class="grow"></span>
    <span class="si" id="st-pos">Ln 1, Col 1</span>
    <span class="sep"></span>
    <button class="si" id="st-lang" aria-haspopup="menu" title="Language">plaintext</button>
  </footer>
</div>

<div id="menu-root"></div>

<script src="/socket.io/socket.io.js"></script>
<script src="/vendor/xterm.js"></script>
<script src="/vendor/addon-fit.js"></script>
<script src="/vendor/monaco/loader.js"></script>
<script src="/client.js"></script>
</body>
</html>
