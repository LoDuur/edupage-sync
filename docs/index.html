<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Stundu saraksts</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📅</text></svg>">
<style>
:root{
  --bg:#f2f2f7;--surface:#ffffff;--surface-2:#f7f7fa;--text:#1c1c1e;--text-2:#6e6e73;--text-3:#aeaeb2;
  --line:rgba(60,60,67,.12);--line-strong:rgba(60,60,67,.24);--accent:#0a84ff;--red:#ff3b30;--amber:#ff9f0a;--green:#34c759;
  --chrome:rgba(242,242,247,.72);--card-shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px -12px rgba(0,0,0,.12);
  --mix-bg:16%;--mix-fg:62%;--con-text:#1c1c1e;--con-dim:#5b5b63;--con-bg:rgba(242,242,247,.86);
  --hour:5.5rem;--axis:3.25rem;--toolbar:6.75rem;--font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Inter,system-ui,sans-serif;
}
:root[data-theme=dark]{
  --bg:#000;--surface:#1c1c1e;--surface-2:#2c2c2e;--text:#f2f2f7;--text-2:#98989f;--text-3:#636366;
  --line:rgba(84,84,88,.45);--line-strong:rgba(84,84,88,.75);--accent:#0a84ff;--red:#ff453a;--amber:#ffd60a;--green:#30d158;
  --chrome:rgba(28,28,30,.72);--card-shadow:none;--mix-bg:24%;--mix-fg:48%;--con-text:#f2f2f7;--con-dim:#98989f;--con-bg:rgba(28,28,30,.82);
}
@media (prefers-color-scheme:dark){:root:not([data-theme]){
  --bg:#000;--surface:#1c1c1e;--surface-2:#2c2c2e;--text:#f2f2f7;--text-2:#98989f;--text-3:#636366;
  --line:rgba(84,84,88,.45);--line-strong:rgba(84,84,88,.75);--accent:#0a84ff;--red:#ff453a;--amber:#ffd60a;--green:#30d158;
  --chrome:rgba(28,28,30,.72);--card-shadow:none;--mix-bg:24%;--mix-fg:48%;--con-text:#f2f2f7;--con-dim:#98989f;--con-bg:rgba(28,28,30,.82);
}}
:root[data-theme=juarch]{
  --bg:#0a0e17;--surface:#111827;--surface-2:#1b2434;--text:#e5edf7;--text-2:#8fa3bf;--text-3:#4f6280;
  --line:rgba(23,147,209,.22);--line-strong:rgba(23,147,209,.5);--accent:#1793d1;--red:#ff5c5c;--amber:#f5b942;--green:#3ddc84;
  --chrome:rgba(10,14,23,.8);--card-shadow:0 0 0 1px rgba(23,147,209,.15);--mix-bg:22%;--mix-fg:50%;--con-text:#e5edf7;--con-dim:#8fa3bf;--con-bg:rgba(10,14,23,.88);
  --font:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
:root[data-theme=juarch] h1::after{content:" juarch";color:var(--accent);font-size:.55em;font-weight:600;letter-spacing:0;vertical-align:.25em}
:root[data-theme=nord]{
  --bg:#2e3440;--surface:#3b4252;--surface-2:#434c5e;--text:#eceff4;--text-2:#d8dee9;--text-3:#7b88a1;
  --line:rgba(216,222,233,.12);--line-strong:rgba(216,222,233,.3);--accent:#88c0d0;--red:#bf616a;--amber:#ebcb8b;--green:#a3be8c;
  --chrome:rgba(46,52,64,.8);--card-shadow:none;--mix-bg:28%;--mix-fg:45%;--con-text:#eceff4;--con-dim:#a5aebf;--con-bg:rgba(46,52,64,.9);
}
:root[data-theme=dracula]{
  --bg:#282a36;--surface:#343746;--surface-2:#44475a;--text:#f8f8f2;--text-2:#bfc3d6;--text-3:#6272a4;
  --line:rgba(98,114,164,.3);--line-strong:rgba(98,114,164,.6);--accent:#bd93f9;--red:#ff5555;--amber:#f1fa8c;--green:#50fa7b;
  --chrome:rgba(40,42,54,.82);--card-shadow:none;--mix-bg:28%;--mix-fg:45%;--con-text:#f8f8f2;--con-dim:#a9afc6;--con-bg:rgba(40,42,54,.9);
}
:root[data-theme=forest]{
  --bg:#edf3ea;--surface:#ffffff;--surface-2:#f4f8f2;--text:#1f2d22;--text-2:#556b5a;--text-3:#94a898;
  --line:rgba(31,45,34,.12);--line-strong:rgba(31,45,34,.28);--accent:#2f8f4e;--red:#c94b3a;--amber:#d69a2c;--green:#2f8f4e;
  --chrome:rgba(237,243,234,.8);--card-shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px -12px rgba(31,45,34,.18);--mix-bg:18%;--mix-fg:62%;--con-text:#1f2d22;--con-dim:#4f6354;--con-bg:rgba(237,243,234,.9);
}
:root[data-theme=sunset]{
  --bg:#fff4ec;--surface:#ffffff;--surface-2:#fff8f3;--text:#3a1f14;--text-2:#8a5a44;--text-3:#c9a48f;
  --line:rgba(58,31,20,.12);--line-strong:rgba(58,31,20,.28);--accent:#ff6b35;--red:#d7263d;--amber:#f7b32b;--green:#3a9d5d;
  --chrome:rgba(255,244,236,.8);--card-shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px -12px rgba(58,31,20,.2);--mix-bg:18%;--mix-fg:62%;--con-text:#3a1f14;--con-dim:#7a5443;--con-bg:rgba(255,244,236,.9);
}
:root[data-theme=rose]{
  --bg:#191724;--surface:#1f1d2e;--surface-2:#26233a;--text:#e0def4;--text-2:#b8b4d6;--text-3:#6e6a86;
  --line:rgba(110,106,134,.3);--line-strong:rgba(110,106,134,.6);--accent:#ebbcba;--red:#eb6f92;--amber:#f6c177;--green:#9ccfd8;
  --chrome:rgba(25,23,36,.84);--card-shadow:none;--mix-bg:28%;--mix-fg:45%;--con-text:#e0def4;--con-dim:#a8a4c8;--con-bg:rgba(25,23,36,.92);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font:100%/1.45 var(--font);background:var(--bg);color:var(--text)}
body{margin:0;min-height:100vh}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:var(--accent);text-decoration:none}

.toolbar{position:sticky;top:0;z-index:20;background:var(--chrome);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);border-bottom:1px solid var(--line)}
.toolbar-inner{max-width:1280px;margin:0 auto;padding:.9rem 1rem .6rem;display:flex;flex-direction:column;gap:.55rem}
.row{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
h1{margin:0;font-size:1.55rem;line-height:1.1;letter-spacing:-.02em;font-weight:700}
.sub{font-size:.8rem;color:var(--text-2);letter-spacing:.005em}
.seg{display:inline-flex;background:var(--line);border-radius:.6rem;padding:2px;gap:2px}
.seg button{padding:.35rem .75rem;border-radius:.5rem;font-size:.85rem;font-weight:600;color:var(--text);transition:transform .1s ease-out,background .15s}
.seg button:hover{background:var(--surface)}
.seg button:active{transform:scale(.96);background:var(--surface)}
.seg button:disabled{opacity:.35;pointer-events:none}
.range{font-weight:600;font-size:.95rem;font-variant-numeric:tabular-nums}
.spacer{flex:1}
.picker{display:none;gap:.35rem}
.picker button{flex:1;padding:.3rem 0;border-radius:.5rem;font-size:.8rem;font-weight:600;color:var(--text-2);display:flex;flex-direction:column;align-items:center;gap:.05rem;transition:transform .1s ease-out}
.picker button:active{transform:scale(.95)}
.picker button b{font-size:1rem;color:var(--text);width:1.75rem;height:1.75rem;display:grid;place-items:center;border-radius:50%}
.picker button.active b{background:var(--accent);color:#fff}
.picker button.istoday b{color:var(--accent)}
.picker button.istoday.active b{color:#fff}

main{max-width:1280px;margin:0 auto;padding:0 0 3rem}
.grid{display:flex;align-items:flex-start;padding:0 1rem}
.axis{flex:0 0 var(--axis);position:relative;margin-top:var(--dayhead);height:var(--canvas)}
.axis span{position:absolute;right:.5rem;transform:translateY(-50%);font-size:.7rem;color:var(--text-3);font-variant-numeric:tabular-nums;font-weight:500}
.nowchip{position:absolute;right:.35rem;transform:translateY(-50%);background:var(--red);color:#fff;font-size:.68rem;font-weight:700;padding:.1rem .35rem;border-radius:.35rem;font-variant-numeric:tabular-nums;z-index:5}
.days{flex:1;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:.5rem;min-width:0}
.day{min-width:0;position:relative}
.dayhead{position:sticky;top:var(--toolbar);z-index:10;height:var(--dayhead);display:flex;align-items:center;gap:.5rem;padding:.25rem .25rem .4rem;background:var(--bg)}
.dayhead .wd{font-size:.8rem;font-weight:600;color:var(--text-2);text-transform:uppercase;letter-spacing:.04em}
.dayhead .num{font-size:1.15rem;font-weight:700;width:2rem;height:2rem;display:grid;place-items:center;border-radius:50%;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.day.today .dayhead .wd{color:var(--accent)}
.day.today .dayhead .num{background:var(--accent);color:#fff}
.pill{font-size:.65rem;font-weight:700;color:var(--amber);border:1px solid currentColor;border-radius:1rem;padding:.05rem .45rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.canvas{position:relative;height:var(--canvas);border-radius:.85rem;background:var(--surface);box-shadow:var(--card-shadow);overflow:hidden;
  background-image:repeating-linear-gradient(to bottom,var(--line) 0,var(--line) 1px,transparent 1px,transparent var(--hour))}
.day.today .canvas{outline:1.5px solid color-mix(in srgb,var(--accent) 45%,transparent);outline-offset:-1.5px}
.empty{position:absolute;inset:0;display:grid;place-items:center;color:var(--text-3);font-size:.85rem;font-weight:500}

.ev{position:absolute;left:.3rem;right:.3rem;border-radius:.55rem;padding:.35rem .5rem .35rem .65rem;overflow:hidden;
  --c:color-mix(in srgb,var(--base) var(--mix-bg),var(--surface));--fg:color-mix(in srgb,var(--base) var(--mix-fg),var(--text));--bar:var(--base);
  background:var(--c);color:var(--fg);transition:opacity .3s,background .3s,color .3s,transform .1s ease-out;display:flex;flex-direction:column;gap:.05rem;min-height:1.4rem}
.ev::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--bar)}
.ev .t{font-weight:600;font-size:.82rem;line-height:1.2;letter-spacing:-.005em;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.ev .m{font-size:.7rem;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.25}
.ev .tm{font-size:.68rem;opacity:.7;font-variant-numeric:tabular-nums;margin-top:auto;line-height:1.2}
.ev.short{padding-top:.25rem;padding-bottom:.25rem;gap:0}
.ev.short .t{-webkit-line-clamp:1}
.ev.short .tm{margin-top:0}
.ev.tiny{padding-top:.15rem;padding-bottom:.15rem}
.ev.tiny .tm{display:none}
.ev.lunch{--base:var(--text-3)}
.ev.past{opacity:.5}
.ev.now{background:var(--base);color:#fff;box-shadow:0 6px 18px -6px color-mix(in srgb,var(--base) 55%,transparent);z-index:2}
.ev.now .m,.ev.now .tm{opacity:.9}
.ev.now::before{background:rgba(255,255,255,.7)}
.free{position:absolute;left:.3rem;right:.3rem;border-radius:.55rem;border:1.5px dashed var(--line-strong);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:.05rem;color:var(--text-3);font-size:.78rem;font-weight:600;letter-spacing:.01em}
.free small{font-weight:500;font-size:.68rem;font-variant-numeric:tabular-nums}
.free.past{opacity:.45}
.brk{position:absolute;left:50%;transform:translate(-50%,-50%);z-index:3;color:var(--text-3);font-size:.62rem;font-weight:500;letter-spacing:.01em;pointer-events:none;white-space:nowrap;background:var(--surface);border:1px solid var(--line);border-radius:1rem;padding:.05rem .5rem;line-height:1.2}
.brk.past{opacity:.5}
.subs{margin:.5rem 0 0;background:color-mix(in srgb,var(--amber) 14%,var(--surface));border:1px solid color-mix(in srgb,var(--amber) 45%,transparent);border-radius:.7rem;padding:.5rem .65rem;font-size:.78rem;line-height:1.35}
.subs b{display:block;color:var(--amber);font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;margin-bottom:.15rem}
.subs div span{opacity:.7;font-variant-numeric:tabular-nums;margin-right:.35rem}

.nowline{position:absolute;left:0;right:0;height:2px;background:var(--red);z-index:4;pointer-events:none}
.nowline::before{content:"";position:absolute;left:-1px;top:50%;width:.7rem;height:.7rem;border-radius:50%;background:var(--red);transform:translate(0,-50%)}

.classic{display:none;padding:0 1rem}
.classic.on{display:block}
body.design-default .grid{display:none}
.paper{background:#fff;color:#000;font-family:Arial,Helvetica,sans-serif;border-radius:.85rem;box-shadow:var(--card-shadow);padding:1.25rem 1.25rem 1rem;overflow-x:auto}
.paper .cls-title{text-align:center;font-size:1.05rem;margin:0 0 .35rem}
.paper .cls-class{text-align:center;font-size:1.45rem;font-weight:700;margin:0 0 .5rem}
.paper .cls-school{font-size:.75rem;margin:0 0 .15rem}
.paper table{border-collapse:collapse;width:100%;min-width:900px;table-layout:fixed}
.paper th,.paper td{border:1px solid #000;padding:0;vertical-align:middle}
.paper thead th{height:3.4rem;font-weight:700;font-size:1.05rem;line-height:1.1}
.paper thead th small{display:block;font-weight:400;font-size:.55rem;margin-top:.15rem}
.paper thead th:first-child,.paper tbody th{width:3.4rem}
.paper tbody th{font-size:1.5rem;font-weight:700}
.paper tbody tr{height:7.2rem}
.paper td.cell{padding:0}
.paper .lesson{position:relative;height:100%;min-height:7.1rem;display:flex;align-items:center;justify-content:center;text-align:center;padding:1rem .3rem;font-weight:700;font-size:.8rem;line-height:1.15;word-break:break-word}
.paper .lesson.lunch{background:#fff!important}
.paper .lesson .tch{position:absolute;top:.15rem;right:.25rem;font-size:.6rem;font-weight:400}
.paper .lesson .room{position:absolute;bottom:.15rem;right:.25rem;font-size:.7rem;font-weight:400}
.paper .stack{display:flex;flex-direction:column;height:100%}
.paper .stack .lesson{min-height:3.5rem;flex:1;border-top:1px solid #000;padding:.9rem .3rem;font-size:.7rem}
.paper .stack .lesson:first-child{border-top:0}
.paper .cls-foot{display:flex;justify-content:space-between;font-size:.72rem;margin-top:.35rem}
.paper .cls-subs{margin-top:.6rem;font-size:.75rem}
.paper .cls-subs b{display:inline-block;margin-right:.4rem}
.sheet-bg{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.35);display:none;align-items:flex-end;justify-content:center}
.sheet-bg.on{display:flex}
.sheet{width:min(560px,100%);background:var(--surface);color:var(--text);border-radius:1.1rem 1.1rem 0 0;padding:1rem 1.1rem calc(1.2rem + env(safe-area-inset-bottom));box-shadow:0 -12px 40px -20px rgba(0,0,0,.5);max-height:88vh;overflow:auto}
.sheet h3{margin:.2rem 0 .8rem;font-size:1.05rem;letter-spacing:-.01em}
.sheet .grab{width:2.4rem;height:.3rem;border-radius:1rem;background:var(--line-strong);margin:0 auto .7rem}
.sheet .act{display:flex;align-items:center;gap:.75rem;padding:.75rem .85rem;border-radius:.75rem;background:var(--surface-2);color:var(--text);margin-bottom:.5rem;font-weight:600;border:1px solid var(--line);transition:transform .1s ease-out}
.sheet .act:active{transform:scale(.985)}
.sheet .act .ico{width:2rem;height:2rem;border-radius:.5rem;display:grid;place-items:center;color:#fff;flex:none}
.sheet .act small{display:block;font-weight:400;color:var(--text-2);font-size:.75rem}
.sheet .url{display:flex;gap:.4rem;margin:.9rem 0 .4rem}
.sheet .url input{flex:1;font:.8rem ui-monospace,Menlo,monospace;padding:.55rem .65rem;border-radius:.6rem;border:1px solid var(--line-strong);background:var(--bg);color:var(--text);min-width:0}
.sheet .url button{padding:.55rem .8rem;border-radius:.6rem;background:var(--accent);color:#fff;font-weight:600}
.sheet ol{margin:.4rem 0 0;padding-left:1.2rem;color:var(--text-2);font-size:.82rem;line-height:1.5}
.sheet .note{font-size:.78rem;color:var(--text-2);margin-top:.5rem}
.sheet details{margin-top:.6rem}
.sheet summary{cursor:pointer;font-weight:600;font-size:.85rem}
.conbtn{width:2rem;height:2rem;border-radius:.5rem;background:var(--line);color:var(--text);font:600 .8rem ui-monospace,Menlo,monospace;display:grid;place-items:center;transition:transform .1s ease-out}
.conbtn:active{transform:scale(.94)}
section{padding:0 1rem}
h2{font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--text-2);margin:2rem 0 .6rem .25rem;font-weight:600}
.inset{background:var(--surface);border-radius:.85rem;box-shadow:var(--card-shadow);overflow:hidden}
.inset>*{display:flex;align-items:center;gap:.75rem;padding:.8rem 1rem;border-bottom:1px solid var(--line);color:var(--text);transition:background .15s}
.inset>*:last-child{border-bottom:0}
.inset a:hover{background:var(--surface-2)}
.inset a:active{background:var(--line)}
.inset .ico{width:2rem;height:2rem;border-radius:.5rem;display:grid;place-items:center;font-size:1rem;flex:none;color:#fff}
.inset .lbl{flex:1;font-weight:500}
.inset .chev{color:var(--text-3)}
footer{padding:2rem 1rem 0;color:var(--text-3);font-size:.75rem;text-align:center}
footer kbd{font:inherit;border:1px solid var(--line-strong);border-radius:.3rem;padding:0 .3rem}

.con{position:fixed;left:0;right:0;bottom:0;z-index:50;max-height:55vh;display:flex;flex-direction:column;background:var(--con-bg);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);border-top:1px solid var(--line-strong);box-shadow:0 -12px 40px -20px rgba(0,0,0,.5);transform:translateY(100%);transition:transform .28s cubic-bezier(.32,.72,0,1);font:.82rem/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--con-text)}
.con.open{transform:none}
.con-out{flex:1;overflow:auto;padding:.75rem 1rem .25rem;white-space:pre-wrap;word-break:break-word}
.con-out pre{margin:0;font:inherit}
.con-out .cmd{color:var(--accent)}
.con-out .err{color:var(--red)}
.con-out .ok{color:var(--green)}
.con-out .dim,.con .dim{color:var(--con-dim)}
.con-sw{display:inline-block;width:.7em;height:.7em;border-radius:50%;vertical-align:-.05em;margin-right:.35em;border:1px solid rgba(0,0,0,.12)}
.con-sug{display:flex;gap:.35rem;flex-wrap:wrap;padding:0 1rem .35rem;min-height:1.4rem}
.con-sug span{padding:.05rem .5rem;border-radius:.4rem;background:var(--line);color:var(--con-dim);cursor:pointer}
.con-sug span.sel{background:var(--accent);color:#fff}
.con-in{display:flex;align-items:center;gap:.5rem;padding:.4rem 1rem .75rem;border-top:1px solid var(--line)}
.con-in b{color:var(--accent);white-space:nowrap}
.con-in .wrap{flex:1;position:relative;display:flex}
.con-in input{flex:1;width:100%;background:none;border:0;outline:0;font:inherit;color:var(--con-text);caret-color:var(--accent);padding:0;margin:0}
.con-in .ghost{position:absolute;left:0;top:0;pointer-events:none;color:var(--con-dim);opacity:.65;white-space:pre;overflow:hidden;max-width:100%}
.con-in .ghost i{visibility:hidden;font-style:normal}
.con-in kbd{color:var(--con-dim);font-size:.7rem;white-space:nowrap}

@media (max-width:899px){
  :root{--hour:5.75rem}
  .picker{display:flex}
  .range{display:none}
  .grid{padding:0 .75rem 0 .5rem}
  .days{display:flex;gap:0;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
  .days::-webkit-scrollbar{display:none}
  .day{flex:0 0 100%;scroll-snap-align:start;scroll-snap-stop:always;padding:0 .25rem}
  .dayhead{position:static;justify-content:center}
  h1{font-size:1.35rem}
  .con-in kbd{display:none}
}
@media (prefers-reduced-transparency:reduce){.toolbar,.con{background:var(--bg);-webkit-backdrop-filter:none;backdrop-filter:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header class="toolbar">
  <div class="toolbar-inner">
    <div class="row">
      <div>
        <h1 id="title">Stundu saraksts</h1>
        <div class="sub" id="updated"></div>
      </div>
      <span class="spacer"></span>
      <span class="range" id="range"></span>
      <button class="conbtn" id="conbtn" aria-label="Konsole" title="Konsole (Ctrl+L)">&gt;_</button>
      <div class="seg">
        <button id="prev" aria-label="Iepriekšējā nedēļa">‹</button>
        <button id="today">Šodien</button>
        <button id="next" aria-label="Nākamā nedēļa">›</button>
      </div>
    </div>
    <div class="picker" id="picker"></div>
  </div>
</header>

<main>
  <div class="grid">
    <div class="axis" id="axis"></div>
    <div class="days" id="days"></div>
  </div>
  <div class="classic" id="classic"></div>

  <section>
    <h2>Pievienot kalendāram</h2>
    <div class="inset">
      <a href="#" data-cal="apple"><span class="ico" style="background:#ff3b30"></span><span class="lbl">Apple / iPhone kalendārs</span><span class="chev">›</span></a>
      <a href="#" data-cal="google"><span class="ico" style="background:#0a84ff">G</span><span class="lbl">Google kalendārs</span><span class="chev">›</span></a>
      <a href="#" data-cal="outlook"><span class="ico" style="background:#0078d4">O</span><span class="lbl">Outlook</span><span class="chev">›</span></a>
      <a href="#" data-cal="other"><span class="ico" style="background:#8e8e93">↓</span><span class="lbl">Cits kalendārs / .ics fails</span><span class="chev">›</span></a>
    </div>
  </section>
  <div class="sheet-bg" id="sheet-bg"><div class="sheet" id="sheet" role="dialog" aria-label="Pievienot kalendāram"></div></div>

  <footer>Dati no <a id="src" href="#" target="_blank" rel="noopener">EduPage</a> · oficiālie stundu laiki · atjaunināts katru stundu · konsole: <kbd>Ctrl</kbd>+<kbd>L</kbd> vai <kbd>`</kbd></footer>
</main>

<div class="con" id="con" role="dialog" aria-label="Konsole">
  <div class="con-out" id="con-out"></div>
  <div class="con-sug" id="con-sug"></div>
  <div class="con-in"><b id="prompt">❯</b><span class="wrap"><span class="ghost" id="ghost"></span><input id="con-in" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="help"></span><kbd>Tab / → pabeigt · ↑↓ · Esc</kbd></div>
</div>

<script>
const WD=["Pirmdiena","Otrdiena","Trešdiena","Ceturtdiena","Piektdiena","Sestdiena","Svētdiena"];
const WDS=["P","O","T","C","Pk"];
const WD2=["Pr","Ot","Tr","Ce","Pk","Se","Sv"];
const HUES=[212,262,340,14,32,48,150,175,192,285];
const pad=n=>String(n).padStart(2,"0");
const fmtD=d=>`${pad(d.getDate())}.${pad(d.getMonth()+1)}.`;
const isoD=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const monday=d=>{const x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return x};
const hm=iso=>iso.slice(11,16);
const toMin=t=>{const [h,m]=t.split(":").map(Number);return h*60+m};
const minOf=iso=>toMin(hm(iso));
const fromMin=m=>`${pad(Math.floor(m/60))}:${pad(m%60)}`;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const reduced=matchMedia("(prefers-reduced-motion: reduce)").matches;
const isMobile=()=>matchMedia("(max-width: 899px)").matches;
const wdIdx=iso=>(new Date(iso).getDay()+6)%7;
const dname=iso=>`${WD[wdIdx(iso)]}, ${fmtD(new Date(iso))}`;

let data,weekStart,rangeStart=8*60,rangeEnd=17*60,bells={},hueMap={},changesData=[];

let prefs={colors:{},theme:"auto",design:"remastered"};
try{prefs={...prefs,...JSON.parse(localStorage.getItem("prefs")||"{}")}}catch(e){}
function savePrefs(){try{localStorage.setItem("prefs",JSON.stringify(prefs))}catch(e){}}
const juarch=()=>!!(prefs.juarch&&prefs.juarch.installed);
const THEMES={auto:"seko sistēmai",light:"gaišā",dark:"tumšā",nord:"Nord – arktiski zils",dracula:"Dracula – violets",forest:"Forest – gaišs, zaļš",sunset:"Sunset – gaišs, silts",rose:"Rosé Pine – tumšs, maigs"};
const themeList=()=>Object.keys(THEMES).concat(juarch()?["juarch"]:[]);
const DESIGNS={default:"klasiskais EduPage režģis",remastered:"jaunais dizains ar laika asi"};
function applyDesign(){if(!DESIGNS[prefs.design])prefs.design="remastered";document.body.classList.toggle("design-default",prefs.design==="default");document.getElementById("classic").classList.toggle("on",prefs.design==="default")}
function applyTheme(){if(!themeList().includes(prefs.theme))prefs.theme="auto";if(prefs.theme==="auto")delete document.documentElement.dataset.theme;else document.documentElement.dataset.theme=prefs.theme}
applyTheme();

function subjectKey(summary){return summary.replace(/\s*\(.*\)\s*$/,"")}
function baseColor(summary){
  const key=subjectKey(summary),p=prefs.colors[key];
  if(typeof p==="string")return p;
  if(typeof p==="number")return `hsl(${p} 70% 52%)`;
  if(!(key in hueMap)){let h=0;for(const c of key)h=(h*31+c.charCodeAt(0))>>>0;hueMap[key]=HUES[h%HUES.length]}
  return `hsl(${hueMap[key]} 70% 52%)`;
}
function pct(min){return (min-rangeStart)/(rangeEnd-rangeStart)*100}
function parsePeriods(p){const n=p.match(/\d+/g).map(Number);return [n[0],n[n.length-1]]}

async function load(){
  data=await (await fetch("data.json?"+Date.now())).json();
  for(const [type,slots] of Object.entries(data.bells||{}))bells[type]=slots.map(s=>s.split("-").map(toMin));
  document.getElementById("title").textContent=data.className;
  document.title=data.className+" · Stundu saraksts";
  setUpdated();
  document.getElementById("src").href=`https://${data.school}.edupage.org/timetable/view.php`;
  weekStart=monday(new Date());
  render();
  fetch("changes.json?"+Date.now()).then(r=>r.json()).then(j=>changesData=j).catch(()=>{});
  requestAnimationFrame(()=>scrollToNow(true));
  setInterval(tick,30000);
}
function setUpdated(){document.getElementById("updated").textContent="Atjaunināts "+new Date(data.updated).toLocaleString("lv-LV",{day:"numeric",month:"long",hour:"2-digit",minute:"2-digit"})}

function splitPeriods(evs){
  const out=[];
  for(const e of evs){
    const [first,last]=parsePeriods(e.periods);
    const table=bells[e.dayType]||bells.midweek;
    if(last===first||!table||!table[last-1]){out.push(e);continue}
    for(let p=first;p<=last;p++){
      const [s,en]=table[p-1];
      out.push({...e,periods:`${p}.`,start:e.start.slice(0,11)+fromMin(s)+e.start.slice(16),end:e.end.slice(0,11)+fromMin(en)+e.end.slice(16)});
    }
  }
  return out;
}
function eventsFor(iso){return splitPeriods(data.events.filter(e=>e.date===iso)).sort((a,b)=>a.start<b.start?-1:1)}

function freeBlocks(evs,dayType){
  const table=bells[dayType]||bells.midweek;
  if(!table||!evs.length)return [];
  const covered=new Set();
  let lo=99,hi=0;
  for(const e of evs){const [a,b]=parsePeriods(e.periods);lo=Math.min(lo,a);hi=Math.max(hi,b);for(let p=a;p<=b;p++)covered.add(p)}
  const out=[];let run=null;
  for(let p=lo;p<=hi;p++){
    if(covered.has(p)||!table[p-1]){if(run){out.push(run);run=null}continue}
    if(run)run.last=p;else run={first:p,last:p};
  }
  if(run)out.push(run);
  return out.map(r=>({start:table[r.first-1][0],end:table[r.last-1][1],count:r.last-r.first+1}));
}

function layoutOverlaps(evs){
  const cols=[];
  for(const e of evs){
    e._s=minOf(e.start);e._e=minOf(e.end);
    let placed=false;
    for(const c of cols){if(c[c.length-1]._e<=e._s){c.push(e);e._col=cols.indexOf(c);placed=true;break}}
    if(!placed){e._col=cols.length;cols.push([e])}
  }
  for(const e of evs){
    e._n=1;
    for(const o of evs)if(o!==e&&o._s<e._e&&e._s<o._e)e._n=Math.max(e._n,Math.max(e._col,o._col)+1);
  }
}

function render(){
  const now=new Date(),todayIso=isoD(now);
  const end=addDays(weekStart,4);
  const weekEvs=[];for(let i=0;i<5;i++)weekEvs.push(...eventsFor(isoD(addDays(weekStart,i))));
  rangeStart=8*60;rangeEnd=17*60;
  for(const e of weekEvs){rangeStart=Math.min(rangeStart,Math.floor(minOf(e.start)/60)*60);rangeEnd=Math.max(rangeEnd,Math.ceil(minOf(e.end)/60)*60)}
  const hours=(rangeEnd-rangeStart)/60;
  document.documentElement.style.setProperty("--canvas",`calc(var(--hour) * ${hours})`);
  document.documentElement.style.setProperty("--dayhead","3rem");
  document.getElementById("range").textContent=`${fmtD(weekStart)} – ${fmtD(end)}${end.getFullYear()}`;
  document.getElementById("prev").disabled=!data.events.some(e=>e.date<isoD(weekStart));
  document.getElementById("next").disabled=!data.events.some(e=>e.date>isoD(end));

  const axis=document.getElementById("axis");
  axis.innerHTML="";
  for(let h=rangeStart/60;h<=rangeEnd/60;h++){const s=document.createElement("span");s.style.top=pct(h*60)+"%";s.textContent=pad(h)+":00";axis.appendChild(s)}
  const chip=document.createElement("span");chip.className="nowchip";chip.id="nowchip";axis.appendChild(chip);

  const wrap=document.getElementById("days");wrap.innerHTML="";
  const picker=document.getElementById("picker");picker.innerHTML="";
  for(let i=0;i<5;i++){
    const d=addDays(weekStart,i),iso=isoD(d),evs=eventsFor(iso);
    const day=document.createElement("div");
    day.className="day"+(iso===todayIso?" today":"");day.dataset.iso=iso;day.dataset.idx=i;
    const short=evs.some(e=>e.dayType==="short");
    const subs=(data.substitutions||[]).filter(s=>s.date===iso);
    const subsHtml=subs.length?`<div class="subs"><b>Aizvietošana</b>${subs.map(s=>`<div><span>${esc(s.period)}.</span>${esc(s.text)}</div>`).join("")}</div>`:"";
    day.innerHTML=`<div class="dayhead"><span class="wd">${WD[i]}</span><span class="num">${d.getDate()}</span>${short?'<span class="pill">Pirmssvētku diena · 30 min</span>':""}</div><div class="canvas"></div>${subsHtml}`;
    const canvas=day.querySelector(".canvas");
    if(!evs.length)canvas.innerHTML='<div class="empty">Nav stundu</div>';
    layoutOverlaps(evs);
    for(const e of evs){
      const el=document.createElement("div");
      const dur=e._e-e._s;
      el.className="ev"+(/pusdienas/i.test(e.summary)?" lunch":"")+(dur<60?" short":"")+(dur<35?" tiny":"");
      el.style.setProperty("--base",baseColor(e.summary));
      el.style.top=pct(e._s)+"%";el.style.height=`calc(${pct(e._e)-pct(e._s)}% - 3px)`;
      if(e._n>1){el.style.width=`calc((100% - .6rem)/${e._n} - 2px)`;el.style.left=`calc(.3rem + (100% - .6rem)/${e._n} * ${e._col})`;el.style.right="auto"}
      el.dataset.s=e._s;el.dataset.e=e._e;
      const meta=[e.location,(e.teachers||[]).join(", ")].filter(Boolean).join(" · ");
      const time=`${hm(e.start)}–${hm(e.end)} · ${esc(e.periods)} st.`;
      el.innerHTML=dur<60
        ?`<div class="t">${esc(e.summary)}</div><div class="tm">${time}${meta?" · "+esc(meta):""}</div>`
        :`<div class="t">${esc(e.summary)}</div>${meta?`<div class="m">${esc(meta)}</div>`:""}<div class="tm">${time}</div>`;
      canvas.appendChild(el);
    }
    const frees=freeBlocks(evs,evs[0]?.dayType);
    let prevEnd=null;
    for(const e of evs){
      if(prevEnd!==null&&e._s>prevEnd){
        const gap=e._s-prevEnd;
        if(gap>=3&&!frees.some(f=>f.start<e._s&&f.end>prevEnd)){
          const b=document.createElement("div");b.className="brk";b.dataset.s=prevEnd;b.dataset.e=e._s;
          b.style.top=pct((prevEnd+e._s)/2)+"%";
          b.textContent=`Starpbrīdis · ${gap} min`;canvas.appendChild(b);
        }
      }
      prevEnd=Math.max(prevEnd??0,e._e);
    }
    for(const f of frees){
      const el=document.createElement("div");
      el.className="free";el.dataset.s=f.start;el.dataset.e=f.end;
      el.style.top=pct(f.start)+"%";el.style.height=`calc(${pct(f.end)-pct(f.start)}% - 3px)`;
      el.innerHTML=`Brīvstunda${f.count>1?` · ${f.count} st.`:""}<small>${fromMin(f.start)}–${fromMin(f.end)}</small>`;
      canvas.appendChild(el);
    }
    if(iso===todayIso){const nl=document.createElement("div");nl.className="nowline";nl.id="nowline";canvas.appendChild(nl)}
    wrap.appendChild(day);

    const b=document.createElement("button");
    b.className=(iso===todayIso?"istoday":"");b.dataset.idx=i;
    b.innerHTML=`<span>${WDS[i]}</span><b>${d.getDate()}</b>`;
    b.onclick=()=>scrollToDay(i,true);
    picker.appendChild(b);
  }
  tick();
  if(isMobile()){
    const todayIdx=Math.round((new Date(todayIso)-weekStart)/864e5);
    scrollToDay(todayIdx>=0&&todayIdx<5?todayIdx:0,false);
  }
  renderClassic();
  applyDesign();
}

const SCHOOL_NAME="Valmieras tehnikums, Vadu iela 3, Valmiera, Latvija";
const EVENING=[[18*60,18*60+45],[19*60,19*60+45],[20*60,20*60+45]];
const CLASSIC_DAYS=["Pi","Ot","Tr","Ce","Pi"];
const fmtFull=d=>`${pad(d.getDate())}.${pad(d.getMonth()+1)}.${d.getFullYear()}.`;
const fmtSlash=d=>`${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()}`;
function pastel(c){return `color-mix(in srgb,${c} 38%,#fff)`}
function renderClassic(){
  const el=document.getElementById("classic");
  const table=(bells.midweek||[]).concat(EVENING),nP=table.length;
  const end=addDays(weekStart,4);
  let h=`<div class="paper"><div class="cls-title">Stundu saraksts ${fmtFull(weekStart)}-${fmtFull(end)}</div><div class="cls-class">${esc(data.className)}</div><div class="cls-school">${SCHOOL_NAME}</div><table><thead><tr><th></th>`;
  table.forEach(([s,e],i)=>{h+=`<th>${i+1}<small>${fromMin(s).replace(/^0/,"")} - ${fromMin(e).replace(/^0/,"")}</small></th>`});
  h+="</tr></thead><tbody>";
  for(let d=0;d<5;d++){
    const iso=isoD(addDays(weekStart,d));
    const evs=data.events.filter(e=>e.date===iso).map(e=>{const [a,b]=parsePeriods(e.periods);return {...e,a,b}}).sort((x,y)=>x.a-y.a||x.b-y.b);
    const clusters=[];
    for(const e of evs){const c=clusters.find(c=>e.a<=c.b&&e.b>=c.a);if(c){c.a=Math.min(c.a,e.a);c.b=Math.max(c.b,e.b);c.items.push(e)}else clusters.push({a:e.a,b:e.b,items:[e]})}
    h+=`<tr><th>${CLASSIC_DAYS[d]}</th>`;
    let p=1;
    while(p<=nP){
      const c=clusters.find(c=>c.a===p);
      if(!c){h+="<td></td>";p++;continue}
      const span=Math.min(c.b,nP)-c.a+1;
      const cell=e=>`<div class="lesson${/pusdienas/i.test(e.summary)?" lunch":""}" style="background:${pastel(baseColor(e.summary))}"><span class="tch">${esc((e.teachers||[]).join(", "))}</span>${esc(e.summary)}<span class="room">${esc(e.location||"")}</span></div>`;
      h+=`<td class="cell" colspan="${span}">${c.items.length>1?`<div class="stack">${c.items.map(cell).join("")}</div>`:cell(c.items[0])}</td>`;
      p=c.a+span;
    }
    h+="</tr>";
  }
  h+=`</tbody></table><div class="cls-foot"><span>Derīgums: ${fmtSlash(weekStart)}-${fmtSlash(end)}</span><span>Stundu saraksts tiešsaistē</span></div>`;
  const subs=(data.substitutions||[]).filter(s=>s.date>=isoD(weekStart)&&s.date<=isoD(end));
  if(subs.length)h+=`<div class="cls-subs"><b>Aizvietošana:</b>${subs.map(s=>`<div>${esc(s.date)} · ${esc(s.period)}. ${esc(s.text)}</div>`).join("")}</div>`;
  el.innerHTML=h+"</div>";
}

function tick(){
  const now=new Date(),m=now.getHours()*60+now.getMinutes();
  const todayIso=isoD(now);
  document.querySelectorAll(".day").forEach(day=>{
    const isToday=day.dataset.iso===todayIso,isPast=day.dataset.iso<todayIso;
    day.querySelectorAll(".ev,.free,.brk").forEach(el=>{
      const s=+el.dataset.s,e=+el.dataset.e;
      el.classList.toggle("now",isToday&&m>=s&&m<e);
      el.classList.toggle("past",isPast||(isToday&&m>=e));
    });
  });
  const nl=document.getElementById("nowline"),chip=document.getElementById("nowchip");
  const visible=m>=rangeStart&&m<=rangeEnd;
  if(nl){nl.style.top=pct(m)+"%";nl.style.display=visible?"":"none"}
  if(chip){chip.style.top=pct(m)+"%";chip.textContent=fromMin(m);chip.style.display=(nl&&visible&&todayVisible())?"":"none"}
}
function todayVisible(){
  const t=document.querySelector(".day.today");
  if(!t)return false;
  if(!isMobile())return true;
  const w=document.getElementById("days");
  return Math.round(w.scrollLeft/w.clientWidth)===+t.dataset.idx;
}
function scrollToNow(initial){
  const nl=document.getElementById("nowline");
  if(!nl||nl.style.display==="none")return;
  const y=nl.getBoundingClientRect().top+window.scrollY-window.innerHeight/3;
  window.scrollTo({top:Math.max(0,y),behavior:initial||reduced?"auto":"smooth"});
}
function scrollToDay(i,smooth){
  const wrap=document.getElementById("days");
  wrap.scrollTo({left:wrap.clientWidth*i,behavior:smooth&&!reduced?"smooth":"auto"});
  setPicker(i);
}
function setPicker(i){
  document.querySelectorAll("#picker button").forEach(b=>b.classList.toggle("active",+b.dataset.idx===i));
  const chip=document.getElementById("nowchip"),nl=document.getElementById("nowline");
  if(chip)chip.style.display=(nl&&nl.style.display!=="none"&&todayVisible())?"":"none";
}
document.getElementById("days").addEventListener("scroll",()=>{
  const w=document.getElementById("days");
  if(w.clientWidth)setPicker(Math.round(w.scrollLeft/w.clientWidth));
},{passive:true});
const ICS_URL=location.href.replace(/index\.html$/,"").replace(/[#?].*$/,"")+"timetable.ics";
const WEBCAL_URL=ICS_URL.replace(/^https?:/,"webcal:");
const UA=navigator.userAgent,IS_IOS=/iPhone|iPad|iPod/.test(UA)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1),IS_MAC=/Macintosh/.test(UA)&&!IS_IOS,IS_ANDROID=/Android/.test(UA);
const GOOGLE_ADD="https://calendar.google.com/calendar/r?cid="+encodeURIComponent(ICS_URL);
const OUTLOOK_ADD="https://outlook.live.com/calendar/0/addfromweb?url="+encodeURIComponent(ICS_URL)+"&name="+encodeURIComponent("Stundu saraksts");
function act(href,ico,color,title,sub,attrs=""){return `<a class="act" href="${href}" ${attrs}><span class="ico" style="background:${color}">${ico}</span><span>${title}<small>${sub}</small></span></a>`}
function openSheet(kind){
  const url=`<div class="url"><input readonly value="${ICS_URL}" onclick="this.select()"><button id="copy-ics">Kopēt</button></div>`;
  let h='<div class="grab"></div>';
  if(kind==="apple"){
    h+="<h3>Apple kalendārs</h3>";
    if(IS_IOS||IS_MAC)h+=act(WEBCAL_URL,"","#ff3b30","Abonēt kalendāru","Atvērsies Kalendārs un jautās apstiprinājumu · atjaunojas automātiski");
    else h+='<div class="note">Šī ierīce nav Apple. Atver šo lapu iPhone/Mac vai pievieno abonementu manuāli:</div>';
    h+=url+"<ol><li>iPhone: Iestatījumi → Programmas → Kalendārs → Konti → Pievienot kontu → Cits → <b>Pievienot abonēto kalendāru</b> → ielīmē saiti</li><li>Mac: Kalendārs → Fails → <b>Jauns kalendāra abonements</b> → ielīmē saiti</li></ol>";
  }else if(kind==="google"){
    h+="<h3>Google kalendārs</h3>";
    h+=act(GOOGLE_ADD,"G","#0a84ff","Pievienot Google kalendāram","Atvērsies calendar.google.com un piedāvās pievienot",'target="_blank" rel="noopener"');
    h+='<div class="note">Google kalendāra <b>mobilā lietotne</b> abonēšanu neatbalsta — jāizdara pārlūkā (var arī telefonā). Ja poga nenostrādā, manuāli:</div>'+url+"<ol><li>Atver <a href=\"https://calendar.google.com/calendar/u/0/r/settings/addbyurl\" target=\"_blank\" rel=\"noopener\">calendar.google.com → Iestatījumi → Pievienot kalendāru → No URL</a></li><li>Ielīmē saiti un spied <b>Pievienot kalendāru</b></li><li>Pēc tam tas parādās arī Google kalendāra lietotnē (var būt jāieslēdz sadaļā Kalendāri)</li></ol><div class=\"note\">Google atjauno abonētos kalendārus reizi ~12–24 h.</div>";
  }else if(kind==="outlook"){
    h+="<h3>Outlook</h3>";
    h+=act(OUTLOOK_ADD,"O","#0078d4","Pievienot Outlook kalendāram","Atvērsies outlook.live.com ar aizpildītu saiti",'target="_blank" rel="noopener"');
    h+=url+"<ol><li>Outlook → Kalendārs → <b>Pievienot kalendāru</b> → <b>Abonēt no tīmekļa</b> → ielīmē saiti</li></ol>";
  }else{
    h+="<h3>Cits kalendārs</h3>";
    h+=act("timetable.ics","↓","#8e8e93","Lejupielādēt .ics failu","Vienreizējs imports (bez automātiskas atjaunošanas)","download");
    h+='<div class="note">Labāk abonē saiti — tad izmaiņas ienāk automātiski:</div>'+url+"<ol><li>Samsung Calendar / citi Android: pievieno caur Google kalendāru (skat. Google)</li><li>Thunderbird, Fastmail, Proton u.c.: <b>Abonēt kalendāru no URL</b> → ielīmē saiti</li></ol>";
  }
  document.getElementById("sheet").innerHTML=h;
  document.getElementById("sheet-bg").classList.add("on");
  const cp=document.getElementById("copy-ics");
  cp.onclick=async()=>{try{await navigator.clipboard.writeText(ICS_URL);cp.textContent="Nokopēts ✓"}catch(e){document.querySelector(".sheet .url input").select();document.execCommand("copy");cp.textContent="Nokopēts ✓"}setTimeout(()=>cp.textContent="Kopēt",1500)};

function parseColor(v){
  v=v.trim();const low=v.toLowerCase();
  if(low in NAMED_COLORS)return NAMED_COLORS[low];
  if(/^\d{1,3}$/.test(v)&&+v<=360)return `hsl(${+v} 70% 52%)`;
  if(/^[0-9a-f]{6}$/i.test(v)||/^[0-9a-f]{3}$/i.test(v))v="#"+v;

  return null;
}
async function steps(list){

  try{
    for(const s of list){
      if(cancelSeq){print('<span class="dim">^C</span>');return false}
      if(typeof s==="number"){await sleep(s);continue}

      if(s.bar!==undefined){const p=pre([""]);for(let i=0;i<=20;i++){if(cancelSeq)break;p.innerHTML=` ${s.bar.padEnd(22)} ${"█".repeat(i)}${"░".repeat(20-i)} ${(i*5).toString().padStart(3)}%`;await sleep(s.ms||35)}continue}

    return !cancelSeq;
  }finally{busy=null}
}

function dayIso(name){
  const t=new Date(),m={mon:0,tue:1,wed:2,thu:3,fri:4,pr:0,ot:1,tr:2,ce:3,pk:4};
  if(name==="today"||name==="šodien")return isoD(t);

  if(name in m)return isoD(addDays(weekStart,m[name]));

function dayLines(iso){
  const evs=eventsFor(iso),lines=[`<b>${dname(iso)}</b>`];
  if(!evs.length)return [...lines,'<span class="dim">Nav stundu</span>'];
  const frees=freeBlocks(evs,evs[0].dayType);
  let prev=null;
  for(const e of evs){
    const s=minOf(e.start),en=minOf(e.end);
    if(prev!==null&&s>prev){
      const f=frees.find(f=>f.start>=prev&&f.end<=s);
      if(f)lines.push(`<span class="dim">      ${fromMin(f.start)}–${fromMin(f.end)}  Brīvstunda · ${f.count} st.</span>`);
      else lines.push(`<span class="dim">      ${"─".repeat(11)}  Starpbrīdis · ${s-prev} min</span>`);
    }
    const meta=[e.location,(e.teachers||[]).join(", ")].filter(Boolean).join(" · ");
    lines.push(`${e.periods.padEnd(5)} ${hm(e.start)}–${hm(e.end)}  ${esc(e.summary)}${meta?` <span class="dim">· ${esc(meta)}</span>`:""}`);
    prev=Math.max(prev??0,en);
  }
  return lines;
}

function exec(toks){
  let [cmd,...args]=toks;
  if(ALIASES[cmd]){const t=tokenize(ALIASES[cmd]);cmd=t[0];args=[...t.slice(1),...args]}
  if(!CMDS[cmd]){
    const m=Object.keys(CMDS).filter(k=>k.startsWith(cmd)&&!(CMDS[k].hide&&CMDS[k].hide()));
    if(m.length===1)cmd=m[0];
    else return print(`${esc(cmd)}: komanda nav atrasta${m.length>1?" · varbūt: "+m.join(", "):""} · ievadi <b>help</b>`,"err");
  }
  try{const r=CMDS[cmd].f(args);if(r&&r.catch)r.catch(e=>print(String(e),"err"))}catch(e){print(String(e),"err")}
}
function run(line){
  if(vimMode){print(`<span class="dim">${esc(line)}</span>`);if(/^:(q|q!|wq|x)$/.test(line.trim())){vimMode=false;print("izgāji no vim. Apsveicu.")}else print('<span class="dim">~   (iziet: :q)</span>');return}
  print(`<span class="cmd">${root?(juarch()?"⚡#":"#"):(juarch()?"»":"❯")}</span> ${esc(line)}`);
  const toks=tokenize(line);
  if(!toks.length)return;
  exec(toks);
}

/* autocomplete */
function pools(){
  const v=conIn.value,toks=tokenize(v),trailing=/\s$/.test(v)||!v;
  const cur=trailing?"":(toks[toks.length-1]||""),n=trailing?toks.length:toks.length-1;
  let pool=[],cmd=toks[0];
  if(ALIASES[cmd]&&n>0)cmd=tokenize(ALIASES[cmd])[0];
  if(n===0)pool=Object.keys(CMDS).filter(c=>!(CMDS[c].hide&&CMDS[c].hide()));
  else if(cmd==="color"||cmd==="reset"||cmd==="kill"){
    if(cmd==="color"&&n>=2&&subjects().some(s=>s.toLowerCase()===toks.slice(1,n).join(" ").toLowerCase()))pool=Object.keys(NAMED_COLORS);
    else pool=subjects().map(q);
  }
  else if(cmd==="theme")pool=themeList();
  else if(cmd==="design")pool=Object.keys(DESIGNS);
  else if(cmd==="week")pool=["today","next","prev"];
  else if(cmd==="cat"||cmd==="rm")pool=Object.keys(FILES);
  else if(cmd==="man"||((cmd==="sudo"||cmd==="judo")&&n===1))pool=Object.keys(CMDS).filter(c=>!["sudo","judo"].includes(c)&&!(CMDS[c].hide&&CMDS[c].hide()));
  else if(cmd==="juarch")pool=["purge","status"];
  else if(cmd==="grep")pool=subjects().map(q);
  else if(cmd==="ping")pool=["edupage"];
  else if(cmd==="compiler")pool=["java","pil","list","works"];
  return {pool,cur,trailing};
}
function suggestions(){
  const {pool,cur}=pools();
  const c=cur.replace(/^"/,"").toLowerCase();
  const starts=pool.filter(p=>p.replace(/^"/,"").toLowerCase().startsWith(c));
  const contains=c.length>1?pool.filter(p=>!starts.includes(p)&&p.toLowerCase().includes(c)):[];
  return [...starts,...contains].slice(0,8);
}
function renderSug(){
  if(pendingSudo||pendingConfirm){conSug.innerHTML="";ghostEl.innerHTML="";return}
  sugs=suggestions();sugIdx=Math.min(sugIdx,Math.max(0,sugs.length-1));
  conSug.innerHTML=sugs.map((s,i)=>`<span class="${i===sugIdx?"sel":""}" data-i="${i}">${esc(s)}</span>`).join("");
  const {cur,trailing}=pools(),s=sugs[sugIdx];
  const cq=cur.replace(/^"/,"").toLowerCase(),sq=s?s.replace(/^"/,""):"";
  if(s&&!trailing&&conIn.value&&sq.toLowerCase().startsWith(cq)&&sq.length>cq.length){
    ghostEl.innerHTML=`<i>${esc(conIn.value)}</i>${esc(sq.slice(cq.length))}${s.startsWith('"')?'"':""}`;
  }else ghostEl.innerHTML="";
}
function accept(i){
  const s=sugs[i];if(!s)return;
  const v=conIn.value,trailing=/\s$/.test(v)||!v;
  const base=trailing?v:v.replace(/(^|\s)("[^"]*"?|'[^']*'?|\S+)$/,"$1");
  conIn.value=base+s+" ";sugIdx=0;renderSug();
}
function toggleCon(open){
  const o=open??!con.classList.contains("open");
  con.classList.toggle("open",o);
  if(o){conIn.focus();if(!conOut.children.length)print('<span class="dim">Stundu saraksta konsole · ievadi <b>help</b> · Tab / → pabeidz · Enter izpilda arī nepabeigtu unikālu komandu</span>');renderSug()}
  else conIn.blur();
}
function submit(){
  const v=conIn.value.trim();conIn.value="";sugIdx=0;
  if(v){history=[v,...history.filter(x=>x!==v)].slice(0,50);try{localStorage.setItem("con-history",JSON.stringify(history))}catch(x){}histIdx=-1;run(v)}
  renderSug();
}

  const inCon=e.target===conIn;
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="l"){e.preventDefault();toggleCon();return}
  if(!inCon&&(e.key==="`"||e.key==="'")&&!e.ctrlKey&&!e.metaKey&&!e.altKey){e.preventDefault();toggleCon(true);return}
  if(e.key==="Escape"&&document.getElementById("sheet-bg").classList.contains("on")){document.getElementById("sheet-bg").classList.remove("on");return}
  if(e.key==="Escape"&&con.classList.contains("open")){
    if(busy==="seq"){cancelSeq=true;return}
    if(busy){stopAnim();return}
    if(pendingConfirm){pendingConfirm=null;conIn.value="";conIn.placeholder="help";setPrompt();print("pārtraukts");renderSug();return}
    if(pendingSudo){pendingSudo=null;conIn.type="text";conIn.value="";conIn.placeholder="help";setPrompt();print(`${sudoName()}: pārtraukts`,"err");renderSug();return}
    if(vimMode){print('<span class="dim">~   (iziet: :q)</span>');return}
    toggleCon(false);return
  }
  if(!inCon)return;
  if(busy){e.preventDefault();return}
  if(pendingSudo){if(e.key==="Enter"){e.preventDefault();finishSudo();renderSug()}else if(e.key==="Tab")e.preventDefault();return}
  if(pendingConfirm){if(e.key==="Enter"){e.preventDefault();finishConfirm();renderSug()}else if(e.key==="Tab")e.preventDefault();return}
  if(e.key==="Tab"){
    e.preventDefault();
    if(!sugs.length)return;
    const last=tokenize(conIn.value).pop()||"",complete=!/\s$/.test(conIn.value)&&sugs[sugIdx]&&sugs[sugIdx].replace(/^"/,"").replace(/"$/,"").toLowerCase()===last.toLowerCase();
    if(sugs.length>1&&(complete||e.shiftKey)){sugIdx=(sugIdx+(e.shiftKey?-1:1)+sugs.length)%sugs.length;accept(sugIdx);conIn.value=conIn.value.trimEnd();renderSug()}
    else accept(sugIdx);
  }
  else if(e.key==="Enter"){e.preventDefault();submit()}
  else if(e.key==="ArrowRight"&&conIn.selectionStart===conIn.value.length&&ghostEl.textContent){e.preventDefault();accept(sugIdx)}
  else if(e.key==="ArrowUp"){e.preventDefault();if(sugs.length>1&&conIn.value){sugIdx=(sugIdx-1+sugs.length)%sugs.length;renderSug()}else if(histIdx<history.length-1){histIdx++;conIn.value=history[histIdx];renderSug()}}
  else if(e.key==="ArrowDown"){e.preventDefault();if(sugs.length>1&&conIn.value){sugIdx=(sugIdx+1)%sugs.length;renderSug()}else{histIdx=Math.max(-1,histIdx-1);conIn.value=histIdx<0?"":history[histIdx];renderSug()}}
  else if(e.ctrlKey&&e.key.toLowerCase()==="u"){e.preventDefault();conIn.value="";renderSug()}
});
conIn.addEventListener("input",()=>{sugIdx=0;renderSug()});
conSug.addEventListener("click",e=>{const i=e.target.dataset.i;if(i!==undefined){accept(+i);conIn.focus()}});
document.getElementById("conbtn").onclick=()=>toggleCon();
setPrompt();
load();
</script>
</body>
</html>
