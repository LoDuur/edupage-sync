function insertSnippet(cm,data,completion){
  const s=L().snippets[completion.text],from=data.from,indent=" ".repeat(cm.getLine(from.line).match(/^\s*/)[0].length);
  const text=s.text.split("\n").map((l,i)=>i?indent+l:l).join("\n");
  cm.replaceRange(text,from,data.to);
  if(typeof s.cur==="number"){const end=cm.getCursor();cm.setCursor({line:end.line,ch:end.ch+s.cur})}
  else{const l=from.line+s.cur.line;cm.setCursor({line:l,ch:cm.getLine(l).length})}
}
function mkPush(out,seen){return (text,k,extra)=>{if(seen.has(text))return;seen.add(text);out.push({text,displayText:text,render:el=>{el.innerHTML=esc(text)+(k?`<span class="k">${esc(k)}</span>`:"")},...extra})}}
function javaHint(cm){
  const cur=cm.getCursor(),line=cm.getLine(cur.line).slice(0,cur.ch);
  const m=line.match(/[A-Za-z_$][\w$.]*$/),word=m?m[0]:"";
  if(!word)return null;
  const from={line:cur.line,ch:cur.ch-word.length},to=cur,low=word.toLowerCase(),seen=new Set(),out=[],push=mkPush(out,seen);
  for(const [key,s] of Object.entries(JAVA.SNIPPETS))if(key.startsWith(low))push(key,s.k,{hint:insertSnippet});
  if(word.includes(".")){for(const w of JAVA.MEMBERS)if(w.toLowerCase().startsWith(low))push(w,"");const tail=word.split(".").pop().toLowerCase(),head=word.slice(0,word.lastIndexOf("."));if(tail&&!JAVA.API.includes(head))for(const w of JAVA.MEMBERS.filter(x=>!x.includes(".")))if(w.toLowerCase().startsWith(tail))push(word.slice(0,word.lastIndexOf(".")+1)+w,"")}
  else{
    for(const w of JAVA.KEYWORDS)if(w.startsWith(low))push(w,"keyword");
    for(const w of JAVA.API)if(w.toLowerCase().startsWith(low))push(w,"java");
    for(const w of JAVA.MEMBERS)if(w.toLowerCase().startsWith(low))push(w,"");
    const re=/[A-Za-z_$][\w$]{2,}/g,doc=cm.getValue();let mm;while((mm=re.exec(doc))){const w=mm[0];if(w!==word&&w.toLowerCase().startsWith(low))push(w,"")}
  }
  return {list:out.slice(0,40),from,to};
}
function pilDocWords(cm,word){
  const out=new Set(),doc=cm.getValue();let m;
  const re=/^\s*([A-Za-z_][\w-]*)\s*(?=\(|:)/gm;while((m=re.exec(doc)))if(m[1]!==word)out.add(m[1]);
  const re2=/(?:^|[\s,(])([A-Za-z_][\w-]{2,})/g;while((m=re2.exec(doc))){const w=m[1];if(w!==word&&!PIL.BUILTIN_SET.has(w))out.add(w)}
  return [...out];
}
function pilHint(cm){
  const cur=cm.getCursor(),line=cm.getLine(cur.line).slice(0,cur.ch);
  const m=line.match(/[A-Za-z_@$][\w$-]*$/),word=m?m[0]:"";
  if(!word)return null;
  const from={line:cur.line,ch:cur.ch-word.length},to=cur,low=word.toLowerCase(),atStart=/^\s*$/.test(line.slice(0,line.length-word.length)),seen=new Set(),out=[],push=mkPush(out,seen);
  if(word.startsWith("@")){for(const d of PIL.DIRECTIVES)if(d.startsWith(low))push(d,"direktīva");return {list:out,from,to}}
  if(word.startsWith("$")||word.startsWith("R$")){for(let i=0;i<8;i++)push("$"+i,"reģistrs");for(let i=0;i<4;i++)push("R$"+i,"atgriešanas reģistrs");return {list:out.filter(o=>o.text.startsWith(word)),from,to}}
  for(const [key,s] of Object.entries(PIL.SNIPPETS))if(key.startsWith(low))push(key,s.k,{hint:insertSnippet});
  for(const w of PIL.KEYWORDS)if(w.startsWith(low))push(w,"atslēgvārds");
  for(const b of PIL.BUILTINS)if(b.n.startsWith(low))push(b.n,b.sig);
  for(const w of pilDocWords(cm,word))if(w.toLowerCase().startsWith(low))push(w,"");
  if(!atStart)for(const w of PIL.MATH)if(w.startsWith(low))push(w,"[ matemātika ]");
  return {list:out.slice(0,40),from,to};
}
function genericHint(cm){
  const cur=cm.getCursor(),line=cm.getLine(cur.line).slice(0,cur.ch);
  const m=line.match(/[A-Za-z_$][\w$.]*$/),word=m?m[0]:"";
  if(!word)return null;
  const from={line:cur.line,ch:cur.ch-word.length},to=cur,low=word.toLowerCase(),seen=new Set(),out=[],push=mkPush(out,seen);
  for(const [key,sn] of Object.entries(L().snippets))if(key.startsWith(low))push(key,sn.k,{hint:insertSnippet});
  for(const w of L().keywords||[])if(w.toLowerCase().startsWith(low))push(w,w.includes(".")?"":"keyword");
  const re=/[A-Za-z_$][\w$]{2,}/g,doc=cm.getValue();let mm;while((mm=re.exec(doc))){const w=mm[0];if(w!==word&&w.toLowerCase().startsWith(low))push(w,"")}
  return {list:out.slice(0,40),from,to};
}
const hinter=()=>lang==="pil"?pilHint:lang==="java"?javaHint:genericHint;
const wordRe=()=>lang==="pil"?/[A-Za-z_@$][\w$-]*$/:/[A-Za-z_$][\w$.]*$/;
function autoHint(cm,ev){
  if(ev.origin!=="+input"||cm.state.completionActive)return;
  const ch=ev.text[ev.text.length-1];
  if(/[\w.$@-]$/.test(ch)){const cur=cm.getCursor(),line=cm.getLine(cur.line).slice(0,cur.ch);if(/[A-Za-z_$@][\w$.-]{1,}$/.test(line))cm.showHint({hint:hinter(),completeSingle:false,closeOnUnfocus:true})}
}

const cm=CodeMirror.fromTextArea($("code"),{mode:"text/x-java",lineNumbers:true,indentUnit:4,tabSize:4,indentWithTabs:false,autoCloseBrackets:true,matchBrackets:true,styleActiveLine:true,gutters:["CodeMirror-linenumbers","err"],extraKeys:{
  "Ctrl-Enter":()=>run(),"Cmd-Enter":()=>run(),"Ctrl-S":()=>openSave(),"Cmd-S":()=>openSave(),
  "Ctrl-Space":c=>c.showHint({hint:hinter(),completeSingle:true}),
  Tab:c=>{if(c.somethingSelected())return c.indentSelection("add");const cur=c.getCursor(),before=c.getLine(cur.line).slice(0,cur.ch);const w=before.match(wordRe());if(w&&w[0]){const r=hinter()(c);if(r&&r.list.length){const first=r.list[0].text,single=r.list.length===1||(L().snippets[first]!==undefined&&first===w[0])||(lang==="java"&&!L().snippets[first]&&first.toLowerCase().startsWith(w[0].toLowerCase()));return c.showHint({hint:hinter(),completeSingle:single})}}c.replaceSelection(" ".repeat(L().indent),"end")},
  "Shift-Tab":c=>c.indentSelection("subtract"),
  "Ctrl-/":c=>c.toggleComment({indent:true,lineComment:L().comment}),"Cmd-/":c=>c.toggleComment({indent:true,lineComment:L().comment}),
  "Ctrl-D":c=>dup(c),"Cmd-D":c=>dup(c),
  "Shift-Alt-F":()=>formatCode(),"Ctrl-=":()=>zoom(1),"Ctrl--":()=>zoom(-1),"Cmd-=":()=>zoom(1),"Cmd--":()=>zoom(-1),
  "Alt-Up":c=>moveLine(c,-1),"Alt-Down":c=>moveLine(c,1)
}});
cm.on("inputRead",autoHint);
cm.on("cursorActivity",()=>{const c=cm.getCursor();$("s-pos").textContent=`${c.line+1}:${c.ch+1}`});
document.addEventListener("mousedown",e=>{if(cm.state.completionActive&&!e.target.closest(".CodeMirror-hints"))cm.state.completionActive.close();if(!e.target.closest(".menu"))$("menu").hidden=true});
function dup(c){const cur=c.getCursor(),l=c.getLine(cur.line);c.replaceRange("\n"+l,{line:cur.line,ch:l.length});c.setCursor({line:cur.line+1,ch:cur.ch})}
function moveLine(c,d){const cur=c.getCursor(),n=cur.line+d;if(n<0||n>=c.lineCount())return;const a=c.getLine(cur.line),b=c.getLine(n);c.operation(()=>{c.replaceRange(a,{line:n,ch:0},{line:n,ch:b.length});c.replaceRange(b,{line:cur.line,ch:0},{line:cur.line,ch:a.length});c.setCursor({line:n,ch:cur.ch})})}
const FORMATTABLE=["java","c","cpp","csharp"];
function formatCode(){if(!FORMATTABLE.includes(lang))return;const cur=cm.getCursor();cm.operation(()=>{for(let i=0;i<cm.lineCount();i++)cm.indentLine(i,"smart")});cm.setCursor(cur)}
let fontSize=+localStorage.getItem("code-font")||13.5;
function zoom(d){fontSize=Math.max(10,Math.min(24,fontSize+d));localStorage.setItem("code-font",fontSize);document.documentElement.style.setProperty("--fs",fontSize+"px");cm.refresh()}
zoom(0);

/* ---- kļūdu marķēšana redaktorā ---- */
let marks=[];
function clearMarks(){for(const m of marks){cm.removeLineClass(m.line,"background",m.cls);cm.setGutterMarker(m.line,"err",null);if(m.w)m.w.clear()}marks=[]}
function markDiags(items){
  clearMarks();const seen=new Set();
  for(const d of items){
    if(!d.line)continue;const l=d.line-1;if(l<0||l>=cm.lineCount()||seen.has(l))continue;seen.add(l);
    const warn=d.kind==="warning",cls=warn?"cm-warn-line":"cm-err-line";
    cm.addLineClass(l,"background",cls);
    const g=document.createElement("span");g.className=warn?"warn-gutter":"err-gutter";g.textContent="●";g.title=d.msg;cm.setGutterMarker(l,"err",g);
    const w=document.createElement("div");w.className="lint"+(warn?" w":"");w.textContent=d.msg;
    marks.push({line:l,cls,w:cm.addLineWidget(l,w,{coverGutter:false,noHScroll:true})});
  }
}
cm.on("change",()=>{if(marks.length)clearMarks()});
const draftKey=l=>"draft-"+l;
const loadDraft=l=>localStorage.getItem(draftKey(l))||(l==="java"?localStorage.getItem("java-draft"):l==="pil"?localStorage.getItem("pil-draft"):null)||LANGS[l].template;
cm.on("change",()=>{if(!viewing){try{localStorage.setItem(draftKey(lang),cm.getValue())}catch(e){}updateFile();if(liveHost)liveHost.changed()}});
function updateFile(){$("filename").textContent=L().fileOf(cm.getValue())}
function status(t,cls){const s=$("st");s.innerHTML=(cls==="run"?icon("loader"):cls==="ok"?icon("check"):cls==="err"?icon("alert"):"")+esc(t);s.className="st "+(cls||"")}
function showTab(name){document.querySelectorAll(".tab[data-tab]").forEach(b=>b.classList.toggle("on",b.dataset.tab===name));$("term").hidden=name!=="out";$("list").hidden=name!=="list"}
document.querySelectorAll(".tab[data-tab]").forEach(b=>b.onclick=()=>{showTab(b.dataset.tab);if(b.dataset.tab==="list")loadList()});
function toggleAI(open){const a=$("ai");a.hidden=open===undefined?!a.hidden:!open;$("ai-toggle").classList.toggle("on",!a.hidden);localStorage.setItem("ai-open",a.hidden?"0":"1");cm.refresh();if(!a.hidden)$("ai-q").focus()}
$("ai-toggle").onclick=()=>toggleAI();$("ai-close").onclick=()=>toggleAI(false);

function buildMenu(){
  const ex=L().examples.map((e,i)=>`<button data-ex="${i}">${icon("file")}${esc(e.name)}</button>`).join("");
  $("menu").innerHTML=`<button data-a="new">${icon("plus")}Jauns fails</button><button data-a="format" ${FORMATTABLE.includes(lang)?"":"disabled"}>${icon("format")}Formatēt<span class="k">⇧⌥F</span></button><button data-a="zin">${icon("zoomin")}Lielāks fonts<span class="k">⌃ +</span></button><button data-a="zout">${icon("zoomout")}Mazāks fonts<span class="k">⌃ −</span></button><hr><div class="h">Piemēri</div>${ex}<hr><button data-a="live">${icon("radio")}Live Coding</button><a href="works/">${icon("folder")}Darbi</a>`;
  $("menu").querySelectorAll("button").forEach(b=>b.onclick=()=>{$("menu").hidden=true;const a=b.dataset.a;if(b.dataset.ex!==undefined)return loadExample(+b.dataset.ex);if(a==="new")newFile();else if(a==="format")formatCode();else if(a==="zin")zoom(1);else if(a==="zout")zoom(-1);else if(a==="live")$("live").click()});
}
$("more").onclick=()=>{buildMenu();$("menu").hidden=!$("menu").hidden};
function leaveView(){if(viewing){if(liveView)closeLiveView();else exitView()}}
function loadExample(i){const e=L().examples[i];leaveView();if(cm.getValue().trim()&&cm.getValue()!==L().template&&!confirm(`Aizvietot kodu ar piemēru „${e.name}”?`))return;cm.setValue(e.code);resetTerm();cm.focus()}

/* ---- valoda ---- */
function setLang(l,{keepCode=false}={}){
  if(!LANGS[l])l="java";
  if(!keepCode&&!viewing)try{localStorage.setItem(draftKey(lang),cm.getValue())}catch(e){}
  lang=l;const d=L();
  localStorage.setItem("code-lang",l);
  $("lang").value=l;
  cm.setOption("mode",d.mode);cm.setOption("indentUnit",d.indent);cm.setOption("tabSize",d.indent);
  if(!keepCode&&!viewing)cm.setValue(loadDraft(l));
  $("s-lang").textContent=`${d.name} · ${d.engine}`;
  updateFile();
  const u=new URL(location.href);u.searchParams.set("lang",l);history.replaceState(null,"",u);
  resetTerm();
  if(liveHost)liveHost.setLang(l);
  $("cnt").hidden=true;loadList();
}
$("lang").onchange=()=>{leaveView();setLang($("lang").value);cm.focus()};

(()=>{const g=$("hsplit"),col=document.querySelector(".col");let drag=false;
  const saved=localStorage.getItem("termh");if(saved)col.style.setProperty("--termh",saved);
  g.addEventListener("mousedown",e=>{drag=true;g.classList.add("on");e.preventDefault()});

/* ---- terminālis (ievade tajā pašā logā) ---- */
const out=$("out"),tout=$("tout"),tin=$("tin"),termIn=$("term-in");
let segs=[],consumed=0,stdinBuf="",waiting=false,busy=false,pendingIn=[],worker=null,runTimer=0,runSeq=0,eofMode=false;
const ansi=s=>esc(s).replace(/\x1b\[0;31m/g,'<span class="e">').replace(/\x1b\[0;33m/g,'<span class="w">').replace(/\x1b\[0m/g,"</span>").replace(/\x1b\[[0-9;]*m/g,"");
function diagHtml(d){
  const items=d.items.map(it=>`<button class="dg${it.kind==="warning"?" w":""}" data-line="${it.line||""}">${icon(it.kind==="warning"?"warn":"alert")}<span>${it.line?`<span class="loc">${esc(fileName())}:${it.line}${it.col?":"+it.col:""}</span>  `:""}${esc(it.msg)}${it.hint?`<span class="hint">${esc(it.hint)}</span>`:""}</span></button>`).join("");
  const raw=d.raw&&d.raw.trim()?`<details><summary>pilns teksts</summary><pre>${esc(d.raw.trim())}</pre></details>`:"";
  const hasErr=d.items.some(i=>i.kind!=="warning");
  return `<span class="diag">${items}${raw}${hasErr?`<button class="ask">${icon("sparkles")}Paskaidrot ar AI</button>`:""}</span>`;
}
const fileName=()=>$("filename").textContent;
function renderTerm(){
  tout.innerHTML=segs.map(s=>s.t==="in"?`<span class="in">${esc(s.s)}</span>\n`:s.t==="e"?`<span class="e">${esc(s.s)}</span>`:s.t==="w"?`<span class="w">${esc(s.s)}</span>`:s.t==="d"?`<span class="d">${esc(s.s)}</span>`:s.t==="diag"?diagHtml(s):ansi(s.s)).join("");
  out.scrollTop=out.scrollHeight;
  tout.querySelectorAll(".dg").forEach(b=>b.onclick=e=>{e.stopPropagation();const l=+b.dataset.line;if(!l)return;cm.setCursor({line:l-1,ch:0});cm.scrollIntoView({line:l-1,ch:0},120);cm.focus()});
  tout.querySelectorAll(".ask").forEach(b=>b.onclick=e=>{e.stopPropagation();toggleAI(true);document.querySelector('.chips [data-q="err"]').click()});
}
out.addEventListener("mouseup",e=>{if(!getSelection().toString()&&!e.target.closest("button,summary,details"))termIn.focus()});
function setWaiting(on){waiting=on;tin.classList.toggle("wait",on);termIn.placeholder="";if(on){status("gaida ievadi","run");termIn.focus()}}
function resetTerm(){abortRun();segs=[];consumed=0;stdinBuf="";pendingIn=[];eofMode=false;setWaiting(false);renderTerm();$("s-time").textContent="";status("")}
$("clear").onclick=resetTerm;
function abortRun(){runSeq++;clearTimeout(runTimer);if(worker){worker.terminate();worker=null}busy=false;termIn.disabled=false;$("run").disabled=false}
termIn.addEventListener("keydown",e=>{
  if(e.key==="c"&&e.ctrlKey){e.preventDefault();if(busy||waiting){abortRun();setWaiting(false);segs.push({t:"d",s:"^C\n"});renderTerm();status("pārtraukts","err")}return}
  if(e.key==="d"&&e.ctrlKey){e.preventDefault();if(waiting&&!busy){eofMode=true;setWaiting(false);segs.push({t:"d",s:"^D\n"});renderTerm();execute(true)}return}
  if(e.key==="l"&&e.ctrlKey){e.preventDefault();resetTerm();return}
  if(e.key!=="Enter")return;
  e.preventDefault();
  const lines=termIn.value.split(/\r?\n/);termIn.value="";
  if(busy)return;
  if(waiting){for(const l of lines){segs.push({t:"in",s:l});stdinBuf+=l+"\n"}setWaiting(false);renderTerm();execute(true)}
  else{for(const l of lines){pendingIn.push(l);segs.push({t:"in",s:l})}renderTerm()}
});
termIn.addEventListener("paste",e=>{const t=e.clipboardData.getData("text");if(t.includes("\n")){e.preventDefault();termIn.value=t.replace(/\n$/,"");termIn.dispatchEvent(new KeyboardEvent("keydown",{key:"Enter"}))}});

function run(){
  if(busy||!cm.getValue().trim())return;
  showTab("out");
  abortRun();
  segs=pendingIn.map(s=>({t:"in",s}));
  stdinBuf=pendingIn.length?pendingIn.join("\n")+"\n":"";pendingIn=[];consumed=0;eofMode=false;
  setWaiting(false);renderTerm();
  execute(false);
}
$("run").onclick=()=>run();
async function execute(cont){
  const code=cm.getValue(),seq=++runSeq,t0=performance.now();
  busy=true;termIn.disabled=true;$("run").disabled=true;
  status(cont?"turpina":L().wandbox&&!["py","lua"].includes(L().wandbox.ext)?"kompilē":"izpilda","run");
  if(!cont)$("s-time").textContent="";
  let r;
  try{r=await (lang==="pil"?runPil(code,stdinBuf):runWandbox(code,stdinBuf))}
  catch(e){if(seq!==runSeq)return;r={out:"",err:"",rc:-1,needAt:-1,diag:{items:[{kind:"error",msg:e.message}],raw:""}}}
  if(seq!==runSeq)return;
  busy=false;termIn.disabled=false;$("run").disabled=false;
  const ms=Math.round(performance.now()-t0);
  const full=r.out||"",cut=r.needAt>=0?r.needAt:full.length;
  if(cut>consumed)segs.push({t:"o",s:full.slice(consumed,cut)});
  consumed=cut;
  if(r.needAt>=0){renderTerm();setWaiting(true);$("s-time").textContent=`${ms} ms`;lastOutput=full.slice(0,cut);lastError="";return}
  const hasDiag=r.diag&&r.diag.items.length;
  if(full&&!full.endsWith("\n"))segs.push({t:"d",s:"\n"});
  if(r.err)segs.push({t:"e",s:r.err.endsWith("\n")?r.err:r.err+"\n"});
  if(hasDiag){segs.push({t:"diag",items:r.diag.items,raw:r.diag.raw});markDiags(r.diag.items)}
  const ok=r.rc===0&&!(hasDiag&&r.diag.items.some(i=>i.kind!=="warning"));
  segs.push({t:"d",s:`${hasDiag?"\n":""}… programma beidzās ar kodu ${r.rc}${r.runtime?" · "+r.runtime:""} · ${ms<1000?ms+" ms":(ms/1000).toFixed(1)+" s"}\n`});
  renderTerm();
  lastOutput=full.replace(/\x1b\[[0-9;]*m/g,"");
  lastError=hasDiag?r.diag.items.map(i=>`${i.kind}${i.line?" rinda "+i.line:""}: ${i.msg}`).join("\n")+(r.diag.raw?"\n"+r.diag.raw.slice(0,1200):""):(r.err||(r.rc!==0?lastOutput.slice(-600):""));
  $("s-time").textContent=`${ms} ms · izeja ${r.rc}`;
  status(ok?"gatavs":"kļūda",ok?"ok":"err");
  termIn.focus();
}

/* ---- kļūdu analīze ---- */
const HINTS=[
  [/NoSuchElementException/,"programma gaida ievadi, bet tās vairs nav"],
  [/ArithmeticException: \/ by zero|ZeroDivisionError|integer divide by zero|DivideByZeroException/,"dalīšana ar nulli"],
  [/ArrayIndexOutOfBounds|IndexOutOfRangeException|IndexError: list index out of range|StringIndexOutOfBounds/,"indekss ārpus masīva robežām – pārbaudi ciklu robežas (< nevis <=)"],
  [/NullPointerException|NullReferenceException/,"mainīgais ir null – tam nav piešķirta vērtība"],
  [/NumberFormatException|ValueError: invalid literal for int|FormatException|InputMismatchException|could not convert string to float/,"teksts nav skaitlis – pārbaudi ievadi"],
  [/StackOverflowError|RecursionError|stack overflow/,"bezgalīga rekursija – trūkst apstāšanās nosacījuma"],
  [/Segmentation fault|SIGSEGV/i,"piekļuve nederīgai atmiņai – pārbaudi masīva indeksus un rādītājus"],
  [/NameError: name '\w+' is not defined/,"mainīgais nav definēts (vai pareizrakstība)"],
  [/cannot find symbol|was not declared in this scope|undeclared|does not exist in the current context/,"nosaukums nav deklarēts – pārbaudi pareizrakstību vai deklarē pirms lietošanas"],
  [/';' expected|expected ';'|missing ';'|CS1002/,"trūkst semikola (parasti iepriekšējā rindā)"],
  [/incompatible types|cannot convert|invalid conversion|TypeError:/,"tipu neatbilstība"],
  [/attempt to (?:call|index|concatenate|perform arithmetic on) a nil value/,"vērtība ir nil – mainīgais nav piešķirts vai funkcija nav definēta"],
  [/IndentationError|unexpected indent/,"nepareizas atkāpes"],
  [/unterminated string|missing terminating|unclosed string/,"nav aizvērtas pēdiņas"],
  [/expected '\)'|expected '}'|reached end of file while parsing|unexpected EOF|expected 'end'|'end' expected/,"trūkst aizverošās iekavas vai bloka beigu"],
  [/undefined reference to `main'|no main method|does not contain a static 'Main'/,"programmai trūkst main"],
];
const hintFor=msg=>{for(const [re,h] of HINTS)if(re.test(msg))return h;return ""};
function diagnose(cls,ce,perr,signal,rc){
  const items=[];const add=(kind,line,col,msg)=>{msg=(msg||"").trim();if(!msg)return;line=+line||0;if(items.some(i=>i.line===line&&i.msg===msg))return;items.push({kind,line,col:+col||0,msg,hint:msg.includes("–")?"":hintFor(msg)})};
  let m,re;
  if(ce){
    if(lang==="java"){re=new RegExp("(?:\\./)?"+cls+"\\.java:(\\d+): (error|warning): (.*)","g");while((m=re.exec(ce)))add(m[2],m[1],0,m[3])}
    else if(lang==="c"||lang==="cpp"){re=/prog\.cc?:(\d+):(\d+): (?:fatal )?(error|warning): (.*)/g;while((m=re.exec(ce)))add(m[3],m[1],m[2],m[4]);if(!items.length&&/undefined reference/.test(ce))add("error",0,0,(ce.match(/undefined reference to [^\n]*/)||["linkera kļūda"])[0])}
    else if(lang==="csharp"){re=/prog\.cs\((\d+),(\d+)\): (error|warning) (CS\d+: .*)/g;while((m=re.exec(ce)))add(m[3],m[1],m[2],m[4])}
    if(!items.length&&/error/i.test(ce))add("error",0,0,ce.split("\n").find(l=>/error/i.test(l))||ce.split("\n")[0]);
  }
  if(perr){
    if(lang==="java"){const ex=perr.match(/(?:Exception in thread "[^"]*" |Caused by: )?((?:[\w.]+\.)?(\w+(?:Exception|Error)))(?:: ([^\n]*))?/);const at=perr.match(new RegExp("at "+cls+"\\.\\w+\\("+cls+"\\.java:(\\d+)\\)"));if(ex)add("runtime",at?at[1]:0,0,ex[2]+(ex[3]?": "+ex[3]:""))}
    else if(lang==="python"){const frames=[...perr.matchAll(/File "[^"]*prog\.py", line (\d+)/g)];const last=perr.trim().split("\n").pop();if(/\w+(?:Error|Exception|Interrupt|Exit)\b/.test(last))add("runtime",frames.length?frames[frames.length-1][1]:0,0,last)}
    else if(lang==="lua"){m=perr.match(/prog\.lua:(\d+): ([^\n]*)/)||perr.match(/lua: [^\n]*?:(\d+): ([^\n]*)/);if(m)add("runtime",m[1],0,m[2]);else if(/^lua:/m.test(perr))add("runtime",0,0,perr.split("\n")[0].replace(/^lua: /,""))}
    else if(lang==="csharp"){m=perr.match(/Unhandled Exception:\s*\n?\s*([\w.]+(?:Exception|Error))(?:: ([^\n]*))?/);if(m)add("runtime",0,0,m[1].split(".").pop()+(m[2]?": "+m[2]:""))}
    else if(lang==="c"||lang==="cpp"){m=perr.match(/terminate called after throwing an instance of '([^']+)'\s*\n?\s*(?:what\(\):\s*(.*))?/);if(m)add("runtime",0,0,m[1]+(m[2]?": "+m[2]:""))}
  }
  const EXIT={137:"programma apturēta – pārsniegts laika vai atmiņas limits (bezgalīgs cikls?)",139:"Segmentation fault – piekļuve nederīgai atmiņai",134:"programma pārtraukta (abort)",136:"aritmētikas kļūda (SIGFPE) – dalīšana ar nulli?",124:"pārsniegts laika limits"};
  if(signal)add("runtime",0,0,`programma pārtraukta: ${signal}`);
  else if(rc!==0&&!items.some(i=>i.kind!=="warning")&&!perr)add("runtime",0,0,EXIT[rc]||`programma beidzās ar kodu ${rc}`);
  return items.sort((a,b)=>(a.line||1e9)-(b.line||1e9));
}
async function runWandbox(code,stdin){
  const d0=L(),wb=d0.wandbox,marker=LANGS_EXTRA.NEED,cls=lang==="java"?JAVA.classNameOf(code):"prog";
  const trimmed=stdin.replace(/\n$/,"");
  let body;
  if(lang==="java"){
    body={compiler:wb.compiler,stdin:trimmed,"compiler-option-raw":"-encoding\nUTF-8","runtime-option-raw":"-Dfile.encoding=UTF-8\n-Dstdout.encoding=UTF-8\n-Dstderr.encoding=UTF-8",
      code:`public class prog { public static void main(String[] a) throws Exception { ${cls}.main(a); } }`,codes:[{file:cls+".java",code}]};
  }else{
    const shim=!eofMode;
    body={compiler:wb.compiler,stdin:trimmed,code:(shim&&wb.prepend?wb.prepend:"")+(shim&&wb.transform?wb.transform(code):code)};
    if(shim&&wb.options)body["compiler-option-raw"]=wb.options;else if(!shim&&wb.options)body["compiler-option-raw"]=wb.options.split("\n").filter(o=>o!=="-include"&&o!=="shim.h").join("\n");
    if(shim&&wb.codes)body.codes=wb.codes();
  }
  const ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),WANDBOX_TIMEOUT);
  let resp;
  try{resp=await fetch(WANDBOX,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body),signal:ctl.signal})}
  catch(e){throw new Error(e.name==="AbortError"?"kompilatora serviss neatbildēja 40 s – mēģini vēlreiz":"nav savienojuma ar kompilatora servisu (wandbox.org)")}
  finally{clearTimeout(tm)}
  if(resp.status===429)throw new Error("par daudz pieprasījumu – pagaidi brīdi");
  if(!resp.ok)throw new Error("kompilatora serviss atbildēja "+resp.status);
  const d=await resp.json();
  const cmsg=(d.compiler_error||"").replace(/prog\.java:\d+: error:.*?\n.*?\n.*?\n/gs,"").replace(/^(?:In file included from )?shim\.h:.*(?:\n(?![^\s]).*)*\n?/gm,"").trim();
  const failed=/(^|\n)[^\n]*\b(error|Error)\b[: (]/.test(cmsg)&&!(d.program_output||d.program_error);
  let perr=d.program_error||"",need=false;
  if(!eofMode&&!failed){
    if(perr.includes(marker)){need=true;perr=perr.replace(marker,"").replace(/\n$/,"")}
    else if(d0.need&&d0.need.test(perr))need=true;
  }
  const rc=failed?1:+(d.status??-1);
  const items=need?[]:diagnose(cls.replace(/\$/g,"\\$"),cmsg,perr,d.signal,rc);
  const raw=[cmsg,need?"":perr].filter(Boolean).join("\n");
  return {out:d.program_output||"",err:need||items.length?"":perr,rc,needAt:need?(d.program_output||"").length:-1,diag:{items,raw:items.length?raw:""}};
}
const STALE={printn:"println",printfn:"printfln",readline:"readln",readchar:"readch",global:"const (faila līmenī)"};
function runPil(code,stdin){
  return new Promise((resolve,reject)=>{
    if(worker)worker.terminate();
    worker=new Worker(`pil/worker.js?v=${encodeURIComponent(pilVer)}`);
    let raw="",needAt=-1;
    worker.onmessage=e=>{
      const d=e.data;
      if(d.t==="out")raw+=d.s;
      else if(d.t==="need"){needAt=d.at;clearTimeout(runTimer);runTimer=setTimeout(()=>{if(worker){worker.terminate();worker=null}finish({rc:0})},400)}
      else if(d.t==="crash"){clearTimeout(runTimer);resolve({out:raw,err:"",rc:-1,needAt:-1,diag:{items:[{kind:"runtime",msg:"interpretators avarēja: "+d.s}],raw:""}})}
      else if(d.t==="done")finish(d);
    };
    function finish(d){
      clearTimeout(runTimer);
      let body=raw,runtime="";const cut=body.lastIndexOf("\nExecution time:\n");
      if(cut>=0){const t=body.slice(cut+1).match(/Runtime: ([\d.]+ms)/);runtime=t?t[1]:"";body=body.slice(0,cut)}
      const items=[];const re=/\x1b\[0;3[13]m(Error|Warning)\x1b\[0m: (.*?)(?: at prog\.pil:(\d+))?\.\n/g;
      const clean=body.replace(re,(all,kind,msg,line)=>{items.push({kind:kind==="Error"?"error":"warning",line:line?+line:0,col:0,msg,hint:hintFor(msg)});return ""}).replace(/\x1b\[0;31mProgram exited with error code \d+\.\x1b\[0m\n?/,"");
      for(const it of items){const s=it.msg.match(/No such function '([\w-]+)'/);if(s&&STALE[s[1]])it.hint=`šajā PIL versijā tas saucas „${STALE[s[1]]}”`}
      const isNeed=needAt>=0&&needAt<=body.length;
      resolve({out:isNeed?body:clean,err:"",rc:d.rc,needAt:isNeed?needAt:-1,runtime,diag:{items:isNeed?[]:items,raw:""}});
    }
    worker.onerror=e=>{clearTimeout(runTimer);reject(new Error(e.message||"worker kļūda"))};
    runTimer=setTimeout(()=>{if(worker){worker.terminate();worker=null}resolve({out:raw,err:"",rc:-1,needAt:-1,diag:{items:[{kind:"runtime",msg:`pārtraukts pēc ${PIL_TIMEOUT/1000} s – bezgalīgs cikls?`}],raw:""}})},PIL_TIMEOUT);
    worker.postMessage({code,stdin,eof:eofMode});
  });
}

async function loadList(){
  const list=$("list");
  try{
    const r=await fetch(`${SUPABASE_URL}/rest/v1/snippets?select=id,title,author,created_at&lang=eq.${lang}&order=created_at.desc&limit=200`,{headers:HEAD});
    current=await r.json();
    $("cnt").textContent=current.length;$("cnt").hidden=!current.length;
    list.innerHTML=current.length?current.map(s=>`<div class="item${viewing&&viewing.id===s.id?" on":""}" data-id="${s.id}">${icon("file")}<b>${esc(s.title)}</b><small>${esc(s.author||"anonīms")} · ${new Date(s.created_at).toLocaleString("lv-LV",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})}</small></div>`).join(""):`<div class="empty">Nav saglabātu ${L().name} darbu</div>`;
    list.querySelectorAll(".item").forEach(el=>el.onclick=()=>openSnippet(el.dataset.id));

async function openSnippet(id){
  const r=await fetch(`${SUPABASE_URL}/rest/v1/snippets?id=eq.${encodeURIComponent(id)}&select=*`,{headers:HEAD});
  const [s]=await r.json();
  if(!s)return toast("Kods nav atrasts");
  if(liveView)closeLiveView();
  if(!viewing)try{localStorage.setItem(draftKey(lang),cm.getValue())}catch(e){}
  viewing=s;
  if((s.lang||"java")!==lang)setLang(s.lang||"java",{keepCode:true});
  cm.setValue(s.code);cm.setOption("readOnly",true);
  $("ro").hidden=false;$("viewbar").hidden=false;$("fork").hidden=false;$("live-end").hidden=true;updateFile();
  $("viewmeta").innerHTML=`<b>${esc(s.title)}</b> · ${esc(s.author||"anonīms")} · ${new Date(s.created_at).toLocaleString("lv-LV")}`;
  history.replaceState(null,"",`./?lang=${lang}&id=${s.id}`);
  document.querySelectorAll(".item").forEach(el=>el.classList.toggle("on",el.dataset.id===s.id));
  showTab("out");
}
function exitView(){viewing=null;cm.setOption("readOnly",false);$("ro").hidden=true;$("viewbar").hidden=true;history.replaceState(null,"",`./?lang=${lang}`);document.querySelectorAll(".item").forEach(el=>el.classList.remove("on"))}

const AI_URL="https://text.pollinations.ai/openai";
const AI_PROXY="https://edupage-proxy.loduur.workers.dev/ai";
let aiModels=[];
async function loadModels(){
  try{
    const r=await fetch(`${AI_PROXY}/models`,{headers:{"X-Access-Key":accessKey()}});

  }catch(e){$("ai-model").innerHTML='<option value="">pollinations</option>'}

const aiLog=$("ai-log");let aiBusy=false,aiHistory=[];
async function aiChat(messages){
  try{
    const r=await fetch(`${AI_PROXY}/chat`,{method:"POST",headers:{"Content-Type":"text/plain","X-Access-Key":accessKey()},body:JSON.stringify({model:$("ai-model").value,messages})});
    const d=await r.json();
    if(r.ok&&d.content)return {content:d.content,provider:d.provider,model:d.model};
  }catch(e){}
  const body=JSON.stringify({model:"openai",messages,temperature:0.3});
  for(let attempt=0;attempt<2;attempt++){
    try{const r=await fetch(AI_URL,{method:"POST",headers:{"Content-Type":"text/plain"},body});if(r.ok){const d=await r.json();const c=d.choices?.[0]?.message?.content;if(c)return {content:c,provider:"pollinations",model:"openai"}}}catch(e){}
    await new Promise(r=>setTimeout(r,1500));
  }
  throw new Error("AI serviss nav sasniedzams");
}

  return `Valoda: ${L().name}. Pašreizējais kods (${L().fileOf(cm.getValue())}):\n\`\`\`${lang}\n${cm.getValue()}\n\`\`\`${stdin?`\nIevade (stdin):\n${stdin}`:""}${lastError?`\nPēdējā kļūda:\n${lastError.slice(0,1500)}`:""}${lastOutput&&!lastError?`\nPēdējā izvade:\n${lastOutput.slice(0,800)}`:""}${waiting?"\nProgramma šobrīd gaida ievadi.":""}`;
}
function renderMd(s){

  return parts.map((p,i)=>i%2?`<pre>${esc(p.trim())}<button class="ins" data-code="${encodeURIComponent(p.trim())}">${icon("edit")}Ievietot</button></pre>`:esc(p).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/`([^`]+)`/g,"<code>$1</code>")).join("");
}
const isWholeFile=code=>lang==="java"?/class\s+\w+/.test(code)&&code.includes("main("):lang==="pil"?/^\s*main\s*\(\s*\)/m.test(code):lang==="python"||lang==="lua"?code.split("\n").length>3:/\bmain\b/.test(code);
function addMsg(role,html){const m=document.createElement("div");m.className="m "+(role==="u"?"u":"a");m.innerHTML=(role==="a"?`<span class="av">${icon("bot")}</span>`:"")+`<div class="b">${html}</div>`;aiLog.appendChild(m);aiLog.scrollTop=aiLog.scrollHeight;return m.querySelector(".b")}
async function ask(userText,shown){
  if(aiBusy)return;aiBusy=true;$("ai-send").disabled=true;
  addMsg("u",esc(shown||userText));
  const a=addMsg("a",'<span class="thinking">…</span>');
  try{
    const messages=[{role:"system",content:PROMPTS.system(lang,PIL.DOC_TEXT)},...aiHistory.slice(-6),{role:"user",content:userText+"\n\n"+ctx()}];
    const res=await aiChat(messages);const text=res.content;
    aiHistory.push({role:"user",content:shown||userText},{role:"assistant",content:text});
    a.innerHTML=renderMd(text)+`<span class="prov">${esc(res.model)}</span>`;
    a.querySelectorAll(".ins").forEach(b=>b.onclick=()=>{const code=decodeURIComponent(b.dataset.code);leaveView();if(isWholeFile(code)){if(confirm("Aizvietot visu kodu?"))cm.setValue(code)}else cm.replaceSelection(code);cm.focus()});
  }catch(e){a.innerHTML=`<span style="color:var(--destructive)">${esc(e.message)}</span>`}
  aiBusy=false;$("ai-send").disabled=false;aiLog.scrollTop=aiLog.scrollHeight;
}

$("ai-send").onclick=()=>{const v=$("ai-q").value.trim();if(!v)return;$("ai-q").value="";$("ai-q").style.height="";ask(v)};
$("ai-q").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();$("ai-send").click()}});
$("ai-q").addEventListener("input",e=>{e.target.style.height="auto";e.target.style.height=Math.min(e.target.scrollHeight,144)+"px"});
