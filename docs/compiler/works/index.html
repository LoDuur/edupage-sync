<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>28teh</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%230d1117'/><text x='16' y='21' font-family='monospace' font-size='13' font-weight='700' fill='%2358a6ff' text-anchor='middle'>28</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/codemirror.min.css">
<link rel="stylesheet" href="../ui.css?v=5">
<style>
body{display:flex;flex-direction:column;height:100vh;overflow:hidden}
.top{display:flex;align-items:center;gap:.5rem;height:48px;padding:0 .75rem;border-bottom:1px solid var(--border);flex-shrink:0}
.brand{display:flex;align-items:center;gap:.55rem;font:600 14px var(--font-mono)}
.brand i{width:22px;height:22px;border-radius:6px;background:var(--primary);color:var(--primary-foreground);display:grid;place-items:center;font:600 10px var(--font-mono);font-style:normal}
.crumb{color:var(--fg-3);font:12.5px var(--font-mono)}
.sp{flex:1}
main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(300px,36%) 1px minmax(0,1fr)}
.vline{background:var(--border)}
.left{display:flex;flex-direction:column;min-height:0}
.tools{display:flex;gap:.4rem;padding:.6rem .75rem;border-bottom:1px solid var(--border)}
.tools .field{flex:1;height:32px;gap:.4rem}
.tools .field svg{color:var(--fg-3);width:14px;height:14px}
.list{flex:1;overflow:auto}
.item{display:flex;align-items:center;gap:.6rem;padding:.6rem .9rem;border-bottom:1px solid var(--border);cursor:pointer;color:var(--foreground)}
.item:hover{background:var(--card)}
.item.on{background:var(--muted)}
.item b{font-size:13px;font-weight:500;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item small{color:var(--fg-3);font-size:12px;white-space:nowrap}
.item .n{color:var(--fg-3);font:11.5px var(--font-mono)}
.lang{display:inline-block;font:11px var(--font-mono);padding:1px 6px;border:1px solid var(--border);border-radius:99px;color:var(--fg-2);min-width:2.6rem;text-align:center}
.item.live{border-left:2px solid var(--destructive)}
.h{padding:.5rem .9rem;font-size:11px;color:var(--fg-3);text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid var(--border)}
.empty{padding:2rem;color:var(--fg-3);text-align:center;font-size:13px}
.right{display:flex;flex-direction:column;min-height:0}
.bar{display:flex;align-items:center;gap:.5rem;height:38px;padding:0 .9rem;border-bottom:1px solid var(--border);font:12.5px var(--font-mono);color:var(--fg-2)}
.bar svg{width:14px;height:14px;color:var(--fg-3)}
.CodeMirror{flex:1;height:auto;font:13.5px/1.65 var(--font-mono);background:var(--background);color:var(--foreground);padding:.35rem 0}
.CodeMirror-gutters{background:var(--background);border-right:0;padding-right:.35rem}
.CodeMirror-linenumber{color:var(--fg-3)}
.cm-keyword{color:#f472b6}.cm-string,.cm-string-2{color:#a3e635}.cm-def{color:#c4b5fd}.cm-variable-3,.cm-type,.cm-builtin{color:#fbbf24}.cm-comment{color:oklch(.5 0 0)}.cm-number{color:#67e8f9}.cm-variable-2{color:#5eead4}.cm-atom{color:#67e8f9}.cm-meta{color:#c4b5fd}
.ph{flex:1;display:grid;place-items:center;color:var(--fg-3);font-size:13px}
.foot{display:flex;gap:.5rem;align-items:center;padding:.45rem .9rem;border-top:1px solid var(--border);font-size:12.5px;color:var(--fg-2);background:var(--card)}
.foot b{color:var(--foreground);font-weight:500}
@media (max-width:820px){main{grid-template-columns:1fr;grid-template-rows:40vh 1px 1fr}}
</style>
</head>
<body>
<header class="top"><a class="brand" href="../"><i>28</i>28teh</a><span class="crumb">/ darbi</span><span class="sp"></span><a class="btn" href="../" data-icon="terminal">Kompilators</a></header>
<main>
  <section class="left">
    <div class="tools"><span class="field"><span data-icon="search"></span><input id="q" placeholder="Meklēt"></span><span class="sel"><select id="lang"><option value="">visas</option><option value="java">Java</option><option value="python">Python</option><option value="c">C</option><option value="cpp">C++</option><option value="csharp">C#</option><option value="lua">Lua</option><option value="pil">PIL</option></select><span data-icon="chevron"></span></span><span class="sel"><select id="sort"><option value="new">jaunākie</option><option value="old">vecākie</option><option value="az">A–Z</option><option value="author">autors</option></select><span data-icon="chevron"></span></span></div>
    <div id="live-box" hidden><div class="h">Tiešraidē</div><div id="live-list"></div></div>
    <div class="list" id="list"><div class="empty">…</div></div>
  </section>
  <div class="vline"></div>
  <section class="right">
    <div class="bar"><span data-icon="file"></span><span id="file">—</span><span class="sp"></span><span id="meta"></span></div>
    <div class="ph" id="ph">Izvēlies darbu</div>
    <textarea id="code" hidden></textarea>
    <div class="foot" id="foot" hidden><span id="viewmeta"></span><span class="sp"></span><button class="btn sm" id="copy" data-icon="copy">Kods</button><button class="btn sm" id="link" data-icon="link">Saite</button><a class="btn sm pri" id="open" href="#" data-icon="play">Atvērt kompilatorā</a></div>
  </section>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/mode/clike/clike.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/mode/python/python.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/mode/lua/lua.min.js"></script>
<script src="../pil/pil-lang.js?v=5"></script>
<script src="../live.js?v=5"></script>
<script src="../ui.js?v=5"></script>
<script>
const SUPABASE_URL="https://jlxnlqkwdshhywdprrtq.supabase.co";
const SUPABASE_KEY="sb_publishable_ElHsgwQvJYfgjdV1yhZugw_aL4HGVaE";
const {esc,$,toast,icon}=UI;UI.hydrateIcons();
const HEAD={apikey:SUPABASE_KEY,Authorization:"Bearer "+SUPABASE_KEY};
const EXT={java:".java",pil:".pil",python:".py",c:".c",cpp:".cpp",csharp:".cs",lua:".lua"},MODE={java:"text/x-java",pil:"pil",python:"python",c:"text/x-csrc",cpp:"text/x-c++src",csharp:"text/x-csharp",lua:"lua"},LABEL={cpp:"c++",csharp:"c#"};
let all=[],current=null,cm=null;
const fmt=d=>new Date(d).toLocaleString("lv-LV",{day:"numeric",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"});
const cls=code=>{const m=code.match(/public\s+(?:final\s+|abstract\s+)*class\s+([A-Za-z_$][\w$]*)/)||code.match(/class\s+([A-Za-z_$][\w$]*)/);return m?m[1]:"Main"};
const langOf=s=>s.lang||"java";
const fileOf=s=>langOf(s)==="pil"?((s.code.match(/^\s*([A-Za-z_][\w-]*)\s*\(/m)||[])[1]||"main")+".pil":langOf(s)==="java"?cls(s.code)+".java":"main"+(EXT[langOf(s)]||"");
async function load(){
  const r=await fetch(`${SUPABASE_URL}/rest/v1/snippets?select=id,title,author,code,lang,created_at&order=created_at.desc&limit=500`,{headers:HEAD});
  all=await r.json();
  const p=new URLSearchParams(location.search);
  if(EXT[p.get("lang")])$("lang").value=p.get("lang");
  renderList();
  if(p.get("id"))open(p.get("id"));
}
function renderList(){
  const q=$("q").value.trim().toLowerCase(),sort=$("sort").value,lang=$("lang").value;
  let items=all.filter(s=>(!lang||langOf(s)===lang)&&(!q||[s.title,s.author,s.code].join("\n").toLowerCase().includes(q)));
  items.sort((a,b)=>sort==="old"?a.created_at.localeCompare(b.created_at):sort==="az"?a.title.localeCompare(b.title,"lv"):sort==="author"?(a.author||"").localeCompare(b.author||"","lv")||b.created_at.localeCompare(a.created_at):b.created_at.localeCompare(a.created_at));
  $("list").innerHTML=items.length?items.map(s=>`<div class="item${current&&current.id===s.id?" on":""}" data-id="${s.id}"><span class="lang">${LABEL[langOf(s)]||langOf(s)}</span><b>${esc(s.title)}</b><small>${esc(s.author||"anonīms")} · ${fmt(s.created_at)}</small><span class="n">#${String(all.length-all.indexOf(s)).padStart(3,"0")}</span></div>`).join(""):'<div class="empty">Nekas nav atrasts</div>';
  $("list").querySelectorAll(".item").forEach(el=>el.onclick=()=>open(el.dataset.id));
}
function open(id){
  const s=all.find(x=>x.id===id);if(!s)return;
  current=s;
  if(!cm){$("ph").hidden=true;$("code").hidden=false;cm=CodeMirror.fromTextArea($("code"),{mode:"text/x-java",lineNumbers:true,readOnly:true})}
  cm.setOption("mode",MODE[langOf(s)]||"text/x-java");
  cm.setValue(s.code);
  $("file").textContent=fileOf(s);$("meta").textContent=fmt(s.created_at);
  $("foot").hidden=false;
  $("viewmeta").innerHTML=`<b>${esc(s.title)}</b> · ${esc(s.author||"anonīms")}`;
  $("open").href=`../?lang=${langOf(s)}&id=${s.id}`;
  history.replaceState(null,"",`?id=${s.id}`);
  document.querySelectorAll(".item").forEach(el=>el.classList.toggle("on",el.dataset.id===s.id));
  setTimeout(()=>cm.refresh(),0);
}
async function loadLive(){
  try{
    const items=await LIVE.listActive();
    $("live-box").hidden=!items.length;
    $("live-list").innerHTML=items.map(s=>`<a class="item live" href="../?live=${s.id}"><span class="lang">${esc(LABEL[s.lang]||s.lang)}</span><b>${esc(s.title)}</b>${s.protected?icon("lock"):""}<small>${esc(s.author||"anonīms")} · no ${new Date(s.started_at).toLocaleTimeString("lv-LV",{hour:"2-digit",minute:"2-digit"})}</small></a>`).join("");
  }catch(e){}
}
$("q").addEventListener("input",renderList);$("sort").addEventListener("change",renderList);$("lang").addEventListener("change",renderList);
$("copy").onclick=async()=>{try{await navigator.clipboard.writeText(current.code);toast("Nokopēts")}catch(e){toast("Neizdevās nokopēt")}};
$("link").onclick=async()=>{try{await navigator.clipboard.writeText(location.href);toast("Saite nokopēta")}catch(e){prompt("Saite:",location.href)}};
UI.requireAccess(()=>{load();loadLive();setInterval(()=>{if(!document.hidden)loadLive()},15000)},{sub:"2.k. 28.grupa · darbi",back:"../../"});
</script>
</body>
</html>
